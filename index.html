  <style>
    :root {
      color-scheme: light;
      --ink: #26323A;
      --muted: #667580;
      --panel: #ffffff;
      --line: #DCE3E6;
      --flight: #2F6E8E;
      --rail: #C26A3A;
      --local: #C9A227;
      --soft: #F7F5F0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
      width: 100%;
      margin: 0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eef2f4;
    }

    .app {
      position: relative;
      display: grid;
      grid-template-columns: 390px minmax(0, 1fr);
      height: 100vh;
      min-height: 0;
    }

    .app.detail-browse {
      grid-template-columns: clamp(520px, 38vw, 580px) minmax(0, 1fr);
    }

    aside {
      z-index: 2;
      padding: 22px;
      overflow: auto;
      max-height: 100vh;
      background: var(--panel);
      border-right: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(25, 37, 49, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .metric {
      padding: 10px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .metric strong {
      display: block;
      font-size: 18px;
      line-height: 1.1;
    }

    .metric span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .route-segment-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 2px 0 4px;
    }

    .route-segment-tabs button {
      min-height: 36px;
      padding: 8px 10px;
      color: var(--ink);
      font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
    }

    .route-segment-tabs button:hover,
    .route-segment-tabs button:focus-visible {
      background: #e9eef3;
      outline: 2px solid rgba(47, 115, 217, 0.25);
      outline-offset: 1px;
    }

    .day-tools {
      display: grid;
      gap: 8px;
      margin: 12px 0 8px;
    }

    .poi-list-select {
      width: 100%;
    }

    .day-tools-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .day-tools button,
    .day-card-open {
      min-height: 32px;
      color: var(--ink);
      font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 7px;
      cursor: pointer;
    }

    .day-tools button {
      padding: 6px 9px;
    }

    .day-tools button:hover,
    .day-tools button:focus-visible,
    .day-card-open:hover,
    .day-card-open:focus-visible {
      background: #e9eef3;
      outline: 2px solid rgba(15, 118, 110, 0.22);
      outline-offset: 1px;
    }

    .day-list {
      display: grid;
      gap: 8px;
      padding-right: 2px;
    }

    .day-card {
      padding: 9px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-left: 5px solid var(--day-color, #0f766e);
      border-radius: 8px;
    }

    .day-card.active {
      background: #eef9f7;
      border-color: rgba(15, 118, 110, 0.35);
      box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.12);
    }

    .day-card.revealed {
      background: #f5f9ff;
      border-color: rgba(47, 115, 217, 0.5);
      box-shadow: 0 0 0 3px rgba(47, 115, 217, 0.18);
    }

    .day-card-open {
      width: 100%;
      padding: 0;
      text-align: left;
      background: transparent;
      border: 0;
    }

    .day-card-date {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .day-card-title {
      display: block;
      margin-top: 2px;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.35;
    }

    .day-card-summary {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .day-card-events {
      display: grid;
      gap: 3px;
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid rgba(215, 221, 227, 0.8);
    }

    .day-card-event {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .day-card-event strong {
      color: var(--ink);
      font-weight: 700;
    }

    .day-transit {
      margin: 2px 0 3px 45px;
      color: #52606d;
      font-size: 10px;
      line-height: 1.4;
    }

    .day-transit summary {
      display: flex;
      align-items: flex-start;
      gap: 5px;
      min-height: 24px;
      padding: 4px 6px;
      background: #fff;
      border-left: 2px solid #a7b2bd;
      cursor: pointer;
      list-style: none;
    }

    .day-transit summary::-webkit-details-marker {
      display: none;
    }

    .day-transit summary::after {
      content: "+";
      margin-left: auto;
      color: var(--muted);
      font-weight: 800;
    }

    .day-transit[open] summary::after {
      content: "−";
    }

    .day-transit-icon {
      flex: 0 0 16px;
      color: #334155;
      text-align: center;
    }

    .day-transit-main {
      min-width: 0;
      font-weight: 700;
    }

    .day-transit-detail {
      padding: 5px 7px 5px 23px;
      color: var(--muted);
      background: #fff;
      border-left: 2px solid #a7b2bd;
    }

    .day-route-marker {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      place-items: center;
      min-width: 48px;
      height: 22px;
      padding: 0 7px;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 999px;
      box-shadow: 0 2px 9px rgba(22, 32, 42, 0.24);
      font: 800 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      white-space: nowrap;
    }

    .day-route-marker.active {
      width: 34px;
      min-width: 34px;
      height: 34px;
      padding: 0;
      border-width: 3px;
      font-size: 15px;
      box-shadow: 0 3px 12px rgba(22, 32, 42, 0.3);
    }

    .day-route-date {
      font-size: 9px;
      opacity: 0.92;
    }

    .day-route-marker.active .day-route-date {
      display: none;
    }

    .candidate-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      user-select: none;
    }

    .candidate-toggle input {
      width: 16px;
      height: 16px;
      accent-color: #0f766e;
    }

    .day-mode-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .poi-list-tools {
      display: grid;
      gap: 8px;
      margin: 12px 0 8px;
    }

    .poi-list-search,
    .poi-list-select {
      width: 100%;
      min-height: 36px;
      padding: 7px 9px;
      color: var(--ink);
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .poi-list-filter-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .poi-list-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .poi-list-clear {
      padding: 4px 7px;
      color: var(--muted);
      font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 7px;
      cursor: pointer;
    }

    .poi-list {
      display: grid;
      gap: 7px;
      padding-right: 2px;
    }

    .poi-list-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .poi-list-open {
      min-width: 0;
      padding: 0;
      text-align: left;
      color: inherit;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .poi-list-name {
      display: block;
      overflow: hidden;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .poi-list-original,
    .poi-list-sub {
      display: block;
      overflow: hidden;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .poi-list-priorities {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 4px;
    }

    .poi-list-priority-btn {
      min-width: 24px;
      min-height: 24px;
      padding: 3px 5px;
      color: var(--muted);
      font: 800 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
    }

    .poi-list-priority-btn.active {
      color: #fff;
      background: #17212b;
      border-color: #17212b;
    }

    .poi-list-empty {
      padding: 10px;
      color: var(--muted);
      background: var(--soft);
      border: 1px dashed var(--line);
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.45;
    }

    .poi-list-thumb {
      display: none;
    }

    .section-title {
      margin: 20px 0 10px;
      font-size: 15px;
      font-weight: 700;
    }

    ol {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li {
      position: relative;
      padding: 0 0 15px 28px;
      border-left: 2px solid #dce3ea;
      margin-left: 8px;
    }

    li::before {
      content: attr(data-step);
      position: absolute;
      left: -13px;
      top: 0;
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      background: var(--rail);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px var(--line);
    }

    li.flight::before {
      background: var(--flight);
    }

    li.local::before {
      background: var(--local);
    }

    li:last-child {
      border-left-color: transparent;
      padding-bottom: 0;
    }

    .date {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .place {
      display: block;
      margin-top: 2px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
    }

    .note {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    #map {
      height: 100vh;
      min-height: 0;
      min-width: 0;
      width: 100%;
    }

    #map .leaflet-control-zoom {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(25, 37, 49, 0.12);
    }

    #map .leaflet-control-zoom a {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      color: var(--ink);
      font: 600 18px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--panel);
      border: 0;
      border-bottom: 1px solid var(--line);
    }

    #map .leaflet-control-zoom a:last-child {
      border-bottom: 0;
    }

    #map .leaflet-control-zoom a:hover,
    #map .leaflet-control-zoom a:focus-visible {
      color: var(--ink);
      background: var(--soft);
      outline: 2px solid rgba(15, 118, 110, 0.22);
      outline-offset: -2px;
    }

    #map .leaflet-control-layers-expanded {
      min-width: 190px;
      max-height: calc(100vh - 24px);
      padding: 11px;
      overflow-y: auto;
      color: var(--ink);
      font: 12px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(25, 37, 49, 0.12);
      backdrop-filter: blur(8px);
    }

    #map .leaflet-control-layers-list {
      margin: 0;
    }

    #map .map-control-title {
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      font-weight: 800;
    }

    #map .map-control-group-label {
      margin: 7px 6px 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    #map .leaflet-control-layers-overlays label {
      margin: 0;
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
    }

    #map .leaflet-control-layers-overlays label:hover {
      background: var(--soft);
    }

    #map .leaflet-control-layers-overlays label > span {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    #map .leaflet-control-layers-selector {
      flex: 0 0 auto;
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: #0f766e;
    }

    .leaflet-popup-content {
      margin: 12px 14px;
      line-height: 1.45;
      min-width: 210px;
    }

    .popup-title {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 700;
    }

    .popup-original {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .popup-date {
      color: var(--muted);
      font-size: 12px;
    }

    .popup-note {
      margin-top: 8px;
      font-size: 13px;
    }

    .popup-note strong {
      color: var(--ink);
    }

    .popup-meta {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .resource-links {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .resource-links button,
    .poi-detail-actions a {
      padding: 5px 8px;
      color: #17324d;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      background: #eef4fa;
      border: 1px solid #d5e3ef;
      border-radius: 7px;
      cursor: pointer;
    }

    .resource-links button:hover,
    .resource-links button:focus-visible,
    .poi-detail-actions a:hover,
    .poi-detail-actions a:focus-visible {
      background: #ddebf7;
      outline: 2px solid rgba(47, 115, 217, 0.25);
      outline-offset: 1px;
    }

    .sidebar-panel[hidden] {
      display: none;
    }

    aside.detail-mode {
      padding: 0;
      overflow: hidden;
    }

    .poi-detail-panel {
      display: grid;
      grid-template-columns: 64px 174px minmax(0, 1fr);
      height: 100vh;
      min-height: 0;
    }

    .poi-detail-day-rail {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100vh;
      padding: 10px 7px;
      background: #f4f7f9;
      border-right: 1px solid var(--line);
    }

    .poi-detail-overview {
      display: grid;
      place-items: center;
      gap: 3px;
      min-height: 48px;
      margin-bottom: 8px;
      padding: 5px 3px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 7px;
      cursor: pointer;
    }

    .poi-detail-overview span {
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
    }

    .poi-detail-overview small {
      font-size: 9px;
      font-weight: 700;
      line-height: 1.1;
    }

    .poi-detail-overview:hover,
    .poi-detail-overview:focus-visible {
      background: #e6edf2;
      outline: 2px solid rgba(47, 115, 217, 0.22);
      outline-offset: 1px;
    }

    .poi-detail-day-rail-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .poi-detail-day-button {
      display: grid;
      place-items: center;
      min-height: 44px;
      padding: 5px 3px;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 7px;
      cursor: pointer;
    }

    .poi-detail-day-button span {
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
    }

    .poi-detail-day-button small {
      margin-top: 2px;
      font-size: 9px;
      line-height: 1.15;
    }

    .poi-detail-day-button:hover,
    .poi-detail-day-button:focus-visible {
      color: var(--ink);
      background: #e6edf2;
      outline: 2px solid rgba(47, 115, 217, 0.22);
      outline-offset: 1px;
    }

    .poi-detail-day-button.active {
      color: #fff;
      background: var(--day-color, #0f766e);
      border-color: var(--day-color, #0f766e);
    }

    .poi-detail-day-list-panel {
      height: 100vh;
      min-width: 0;
      overflow-y: auto;
      background: #fbfcfd;
      border-right: 1px solid var(--line);
    }

    .poi-detail-day-list-header {
      position: sticky;
      top: 0;
      z-index: 3;
      padding: 15px 12px 11px;
      background: rgba(251, 252, 253, 0.97);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }

    .poi-detail-day-list-header strong {
      display: block;
      font-size: 14px;
      line-height: 1.35;
    }

    .poi-detail-day-list-header span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
    }

    .poi-detail-day-list-header span.needs-reroute {
      color: #9a5b00;
      font-weight: 700;
    }

    .poi-detail-day-list {
      display: grid;
      gap: 2px;
      padding: 8px;
      transition: box-shadow 120ms ease;
    }

    .poi-detail-day-list.edge-scroll-top {
      box-shadow: inset 0 42px 28px -24px rgba(15, 118, 110, 0.68);
    }

    .poi-detail-day-list.edge-scroll-bottom {
      box-shadow: inset 0 -42px 28px -24px rgba(15, 118, 110, 0.68);
    }

    .poi-detail-day-drop-indicator {
      position: relative;
      height: 3px;
      margin: 2px 8px 2px 48px;
      background: #0f766e;
      border-radius: 999px;
      box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.14);
    }

    .poi-detail-day-drop-indicator::before {
      position: absolute;
      top: -3px;
      left: -4px;
      width: 9px;
      height: 9px;
      content: "";
      background: #0f766e;
      border-radius: 50%;
    }

    .poi-detail-day-route-warning {
      margin: 2px 4px 6px;
      padding: 7px 9px;
      color: #7a4b00;
      font-size: 10px;
      font-weight: 700;
      background: #fff4dd;
      border-left: 3px solid #c58a1f;
      border-radius: 4px;
    }

    .city-event-notices {
      display: grid;
      gap: 6px;
      margin: 2px 4px 8px;
    }

    .city-event-notice {
      padding: 8px 9px;
      color: #513717;
      font-size: 10px;
      line-height: 1.45;
      background: #fff8e8;
      border-left: 3px solid #d97706;
      border-radius: 4px;
    }

    .city-event-notice strong,
    .city-event-notice span {
      display: block;
    }

    .city-event-notice span {
      margin-top: 3px;
      color: #745734;
    }

    .poi-detail-day-section-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin: 9px 4px 4px;
      padding-top: 9px;
      color: var(--ink);
      border-top: 1px solid var(--line);
    }

    .poi-detail-day-section-label strong {
      font-size: 11px;
      line-height: 1.3;
    }

    .poi-detail-day-section-label span {
      color: var(--muted);
      font-size: 9px;
      line-height: 1.3;
    }

    .poi-detail-day-place {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 26px;
      gap: 4px;
      width: 100%;
      min-height: 48px;
      padding: 5px 4px;
      color: var(--ink);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 7px;
    }

    .poi-detail-day-place:hover,
    .poi-detail-day-place:focus-within {
      background: #eef3f7;
      border-color: #d8e1e8;
    }

    .poi-detail-day-place.active {
      background: #e6f1fb;
      border-color: #a8c9e5;
    }

    .poi-detail-day-place.candidate .poi-detail-day-place-order {
      color: var(--place-color, #2f7fb9);
      background: #fff;
      border: 1px dashed var(--place-color, #2f7fb9);
    }

    .poi-detail-day-transit {
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 24px;
      padding: 2px 8px 2px 30px;
      color: #52606d;
      font-size: 9px;
      font-weight: 700;
      line-height: 1.35;
    }

    .poi-detail-day-transit::before {
      content: "↓";
      flex: 0 0 auto;
      color: #7a8793;
      font-size: 11px;
    }

    .poi-detail-day-transit.estimated {
      color: #6f5b32;
    }

    .poi-detail-day-place.dragging {
      z-index: 4;
      opacity: 0.96;
      background: #fff;
      border-color: #0f766e;
      box-shadow: 0 14px 30px rgba(23, 33, 43, 0.22);
      transition: none;
    }

    .poi-detail-day-place-handle {
      position: relative;
      display: grid;
      place-items: center;
      align-self: stretch;
      width: 44px;
      min-width: 44px;
      padding: 0;
      color: #7a8793;
      background: transparent;
      border: 0;
      cursor: grab;
      font-size: 14px;
      line-height: 1;
      touch-action: none;
    }

    .poi-detail-day-place-handle::before {
      position: absolute;
      top: 7px;
      bottom: 7px;
      left: 4px;
      width: 3px;
      content: "";
      background: #0f766e;
      border-radius: 999px;
    }

    .poi-detail-day-place-handle:active {
      cursor: grabbing;
    }

    .poi-detail-day-place-handle:hover,
    .poi-detail-day-place-handle:focus-visible,
    .poi-detail-day-place-open:focus-visible,
    .poi-detail-day-shift:focus-visible,
    .poi-detail-day-toggle:focus-visible {
      outline: 2px solid rgba(47, 115, 217, 0.3);
      outline-offset: 1px;
    }

    .poi-detail-day-place-spacer {
      width: 44px;
    }

    .poi-detail-day-place-open {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 8px;
      min-width: 0;
      padding: 2px;
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .poi-detail-day-place-order {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      color: #fff;
      background: var(--place-color, #2f7fb9);
      border-radius: 50%;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
    }

    .poi-detail-day-place-copy {
      min-width: 0;
    }

    .poi-detail-day-place-copy strong,
    .poi-detail-day-place-copy span {
      display: block;
      overflow-wrap: anywhere;
    }

    .poi-detail-day-place-copy strong {
      font-size: 12px;
      line-height: 1.35;
    }

    .poi-detail-day-place-copy span {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.3;
    }

    .poi-detail-day-place-shifts {
      display: none;
    }

    .poi-detail-day-place-actions {
      display: grid;
      align-content: center;
      gap: 3px;
    }

    .poi-detail-day-action-spacer {
      width: 24px;
    }

    .poi-detail-day-shift,
    .poi-detail-day-toggle {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      padding: 0;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 50%;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
    }

    .poi-detail-day-toggle.add {
      color: #1f5f99;
      background: #eef6fc;
      border-color: #bfd8eb;
      font-size: 17px;
    }

    .poi-detail-day-toggle.remove {
      color: #8a3f3f;
      background: #fff7f5;
      border-color: #ead4d0;
      font-size: 17px;
    }

    .poi-detail-day-shift:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .poi-detail-day-toggle:disabled,
    .poi-list-priority-btn:disabled,
    .poi-list-select:disabled {
      cursor: default;
      opacity: 0.58;
    }

    .poi-detail-day-list-empty {
      padding: 18px 10px;

      font-size: 13px;
      line-height: 1.6;

      border-color: #1f5f99;

      background: #174b79;

    .image-preview-caption {

      color: var(--muted);

      line-height: 1.35;

    .image-preview-grid button {

      border-radius: 7px;

    .image-preview-grid img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .resource-status {

      line-height: 1.45;
    }

    .priority-control {

    .priority-label {

      font-size: 12px;
      font-weight: 700;

    .priority-buttons {

    .priority-btn {

      border: 1px solid var(--line);
      border-radius: 7px;
      cursor: pointer;

    .priority-btn.active {
      color: #fff;
      background: #17212b;
      border-color: #17212b;
    }

    .priority-btn.clear {

    }

    .priority-badge {

      top: -8px;
      display: grid;
      place-items: center;
      width: 17px;
      height: 17px;
      color: #17212b;
      background: #fff;
      border: 1px solid rgba(23, 33, 43, 0.22);
      border-radius: 50%;
      font-size: 10px;
      font-weight: 900;
      box-shadow: 0 1px 4px rgba(22, 32, 42, 0.22);
    }

    .poi-marker {
      --poi-marker-color: #17212b;
      position: relative;
      width: 24px;
      height: 24px;
      color: #fff;
      font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .poi-marker-surface {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      overflow: hidden;
      color: inherit;
      background: var(--poi-marker-color);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 2px 9px rgba(22, 32, 42, 0.28);
    }

    .poi-marker.candidate {
      opacity: 0.38;
      filter: grayscale(0.22);
    }

    .poi-marker.selected {
      opacity: 1;
      filter: none;
    }

    .poi-marker-label {
      position: absolute;
      top: 50%;
      left: calc(100% + 6px);
      display: block;
      max-width: 180px;
      padding: 4px 6px;
      overflow: hidden;
      color: var(--ink);
      font: 700 11px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(23, 33, 43, 0.2);
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(22, 32, 42, 0.2);
      transform: translateY(-50%);
    }

    .poi-marker.scheduled {
      width: 26px;
      height: 26px;
      padding: 0;
      font-weight: 900;
      line-height: 1;
    }

    .poi-marker.scheduled .poi-marker-surface {
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9), 0 2px 9px rgba(22, 32, 42, 0.32);
    }

    .poi-marker.scheduled .schedule-main {
      font-size: 12px;
    }

    .poi-marker.scheduled .schedule-category {
      position: absolute;
      right: -6px;
      bottom: -6px;
      display: grid;
      place-items: center;
      width: 15px;
      height: 15px;
      color: var(--ink);
      background: #fff;
      border: 1px solid rgba(23, 33, 43, 0.24);
      border-radius: 50%;
      font-size: 8px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 1px 4px rgba(22, 32, 42, 0.2);
    }

    .poi-marker.scheduled.current-day {
      width: 28px;
      height: 28px;
      font-size: 11px;
    }

    .poi-marker.scheduled.current-day .poi-marker-surface {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.95), 0 2px 10px rgba(22, 32, 42, 0.38);
    }

    .poi-marker.top50 {
      width: 28px;
      height: 28px;
      --poi-marker-color: #111827;
      color: #fff;
    }

    .poi-marker.wine {
      --poi-marker-color: #7b2f6a;
    }

    .poi-marker.sweet {
      --poi-marker-color: #cf4d7f;
    }

    .poi-marker.coffee {
      --poi-marker-color: #8b5e3c;
    }

    .poi-marker.food {
      --poi-marker-color: #256f73;
    }

    .poi-marker.hotel {
      --poi-marker-color: #5467a6;
    }

    .poi-marker.art {
      --poi-marker-color: #2f7fb9;
    }

    .poi-marker.local-life {
      --poi-marker-color: #6f8f37;
    }

    .poi-marker.sight {
      --poi-marker-color: #c58a1f;
    }

    .poi-marker.event {
      --poi-marker-color: #d97706;
    }

    .poi-marker.event .poi-marker-surface {
      box-shadow: 0 0 0 2px rgba(255, 248, 232, 0.95), 0 2px 9px rgba(22, 32, 42, 0.3);
    }

    .mobile-app-bar,
    .mobile-sheet-handle,
    .mobile-sheet-footer,
    .mobile-change-summary {
      display: none;
    }

    .mobile-bottom-sheet,
    .mobile-sheet-view {
      display: contents;
    }

    .mobile-day-group {
      display: none;
    }

    .mobile-only-label,
    .mobile-priority-label {
      display: none;
    }

    @media (min-width: 1100px) {
      .app.detail-browse {
        grid-template-columns: clamp(640px, 43vw, 700px) minmax(0, 1fr);
      }

      .poi-detail-panel {
        grid-template-columns: 64px clamp(220px, 16vw, 250px) minmax(0, 1fr);
      }

      .poi-detail-day-list {
        padding: 10px;
      }

      .poi-detail-day-place {
        grid-template-columns: 44px minmax(0, 1fr) 30px;
        gap: 6px;
        min-height: 54px;
        padding: 7px 6px;
      }

      .poi-detail-day-place-handle,
      .poi-detail-day-place-spacer {
        min-width: 44px;
        width: 44px;
      }

      .poi-detail-day-toggle {
        width: 28px;
        height: 28px;
      }

      .poi-detail-day-action-spacer {
        width: 28px;
      }
    }

    @media (max-width: 820px) {
      :root {
        --mobile-app-bar-height: 64px;
        --mobile-sheet-compact-height: 43dvh;
      }

      .app {
        display: block;
        overflow: hidden;
      }

      .app.detail-browse {
        display: block;
      }

      .mobile-app-bar {
        position: fixed;
        inset: 0 0 auto;
        z-index: 1100;
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr) 48px 48px;
        align-items: center;
        gap: 4px;
        min-height: var(--mobile-app-bar-height);
        padding: 8px 10px;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }

      .mobile-app-bar button,
      .mobile-sheet-handle,
      .mobile-sheet-footer button {
        min-width: 44px;
        min-height: 44px;
        color: var(--ink);
        font: 750 13px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
      }

      .mobile-app-bar button:focus-visible,
      .mobile-sheet-handle:focus-visible,
      .mobile-sheet-footer button:focus-visible {
        outline: 3px solid rgba(15, 118, 110, 0.22);
        outline-offset: 1px;
      }

      .mobile-app-heading {
        min-width: 0;
        padding: 0 8px;
      }

      .mobile-app-heading strong,
      .mobile-app-heading span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mobile-app-heading strong {
        font-size: 17px;
        line-height: 1.25;
      }

      .mobile-app-heading span {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.25;
      }

      .mobile-app-action {
        padding: 4px;
      }

      .mobile-app-action-label {
        display: block;
        font-size: 11px;
      }

      .mobile-bottom-sheet {
        position: fixed;
        inset: auto 0 0;
        z-index: 1050;
        display: grid;
        grid-template-rows: 44px minmax(0, 1fr) auto;
        height: var(--mobile-sheet-compact-height);
        min-height: 0;
        overflow: hidden;
        background: #fff;
        border-top: 1px solid var(--line);
        border-radius: 8px 8px 0 0;
        box-shadow: 0 -6px 18px rgba(23, 33, 43, 0.12);
        transition: height 180ms ease;
      }

      .mobile-bottom-sheet[data-sheet-snap="compact"] {
        height: var(--mobile-sheet-compact-height);
      }

      .mobile-bottom-sheet[data-sheet-snap="expanded"] {
        height: calc(100dvh - var(--mobile-app-bar-height));
      }

      .mobile-sheet-handle {
        position: relative;
        display: block;
        width: 100%;
        min-height: 44px;
        padding: 0;
        background: #fff;
        border: 0;
        border-radius: 0;
      }

      .mobile-sheet-handle::before {
        content: "";
        position: absolute;
        top: 18px;
        left: 50%;
        width: 48px;
        height: 4px;
        background: #aab4bd;
        border-radius: 4px;
        transform: translateX(-50%);

      .mobile-sheet-view {
        display: block;
        min-height: 0;
        overflow: hidden;

      aside {
        width: 100%;
        height: 100%;
        max-height: none;
        padding: 14px 16px 18px;

        border-right: 0;

        box-shadow: none;

        overflow-y: auto;
        background: #fff;
        backdrop-filter: none;

      #map .leaflet-control-layers-toggle {

      #map .leaflet-control-zoom a {

        height: 44px;

        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        padding: 7px 10px max(7px, env(safe-area-inset-bottom));
        background: #f7f9fa;
        border-top: 1px solid var(--line);

      .mobile-sheet-footer button {
        min-width: 0;
        padding: 5px 3px;
        font-size: 11px;
      }

      .mobile-sheet-footer button:disabled {

        opacity: 0.65;

        position: absolute;
        inset: auto 10px 61px;
        z-index: 3;
        max-height: 48%;
        padding: 12px;
        overflow-y: auto;
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 8px 20px rgba(23, 33, 43, 0.16);

      .mobile-change-summary:not([hidden]) {

      .mobile-change-summary h2 {
        margin: 0;
        font-size: 14px;

      }

      .mobile-bottom-sheet[data-mobile-view="candidates"] .trip-overview-heading,
      .mobile-bottom-sheet[data-mobile-view="candidates"] .day-overview-section-title,
      .mobile-bottom-sheet[data-mobile-view="candidates"] .day-tools,
      .mobile-bottom-sheet[data-mobile-view="candidates"] .day-list {
        display: none;
      }

      .mobile-bottom-sheet[data-mobile-view="overview"] .poi-list-section-title,
      .mobile-bottom-sheet[data-mobile-view="overview"] .poi-list-tools,
      .mobile-bottom-sheet[data-mobile-view="overview"] .poi-list-meta,
      .mobile-bottom-sheet[data-mobile-view="overview"] .poi-list {
        display: none;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .poi-list-filter-grid {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        scrollbar-width: thin;
      }

      .poi-list-filter-grid .poi-list-select {
        flex: 0 0 150px;
      }

      .poi-list-item {
        grid-template-columns: 44px minmax(0, 1fr) auto;
        min-height: 64px;
      }

      .poi-list-thumb {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        overflow: hidden;
        color: #fff;
        background: var(--place-color, #2f7fb9);
        border-radius: 7px;
        font-size: 12px;
        font-weight: 800;
      }

      .poi-list-thumb img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .mobile-day-group {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin: 12px 2px 4px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }

      .mobile-day-group strong {
        font-size: 13px;
      }

      .mobile-day-group span {
        color: var(--muted);
        font-size: 11px;
      }

      .desktop-only-label,
      .desktop-priority-label {
        display: none;
      }

      .mobile-only-label,
      .mobile-priority-label {
        display: inline;
      }

      .poi-list-priorities {
        width: 94px;
      }

      .poi-list-priority-btn {
        min-width: 42px;
        min-height: 44px;
      }

      .poi-detail-itinerary-controls .poi-list-select,
      .poi-detail-itinerary-controls .priority-btn {
        min-height: 44px;
      }

      .image-preview-viewer img {
        height: auto;
        aspect-ratio: 16 / 9;
      }

      h1 {
        font-size: 21px;
      }
    }
  </style>
</head>
<body>
  <main class="app" data-canonical-interaction="europe-map-direct-v1" data-mobile-shell="map-first-v1">
    <header class="mobile-app-bar" id="mobile-app-bar" aria-label="移动端地图导航">
      <button type="button" class="mobile-app-action" id="mobile-overview-action" data-mobile-view="overview" aria-label="返回全程总览">
        <span class="mobile-app-action-label">返回</span>
      </button>
      <div class="mobile-app-heading">
        <strong id="mobile-app-title">武汉 + 宜昌 5 天 4 晚 · 江城过早与两坝一峡</strong>
        <span id="mobile-app-meta">18 天 · 4 个城市</span>
      </div>
      <button type="button" class="mobile-app-action" id="mobile-search-action" aria-label="搜索地点">
        <span class="mobile-app-action-label">搜索</span>
      </button>
      <button type="button" class="mobile-app-action" id="mobile-layer-action" aria-label="地图图层" aria-expanded="false">
        <span class="mobile-app-action-label">图层</span>
      </button>
    </header>

    <section class="mobile-bottom-sheet" id="mobile-bottom-sheet" data-mobile-view="overview" data-sheet-snap="compact" aria-label="旅行行程面板">
      <button type="button" class="mobile-sheet-handle" id="mobile-sheet-handle" aria-label="展开行程面板" aria-expanded="false"></button>
      <div class="mobile-sheet-view" id="mobile-sheet-view">
    <aside id="sidebar">
      <div class="sidebar-panel" id="itinerary-panel">
      <div class="trip-overview-heading">
      <h1>武汉 + 宜昌 5 天 4 晚 · 江城过早与两坝一峡地图</h1>
      <p class="subtitle">东湖划船、省博、长江大桥与轮渡，外加宜昌两坝一峡与升船机；住宿和交通均为公开规划级信息。</p>
<p class="subtitle" style="margin-top:8px"><a href="reservations.html" style="color:var(--rail);font-weight:700;text-decoration:none">📋 预约与预订清单</a></p>

      <div class="summary" aria-label="行程摘要">
        <div class="metric"><strong>5</strong><span>自然日</span></div>
        <div class="metric"><strong>1</strong><span>住宿核心</span></div>
        <div class="metric"><strong>0</strong><span>同期活动</span></div>
        <div class="metric"><strong id="poi-count">0</strong><span>吃喝玩 POI</span></div>
      </div>
      </div>

      <div class="section-title day-overview-section-title"><span class="desktop-only-label">每日行程路线</span><span class="mobile-only-label">全程安排</span></div>
      <div class="day-tools" aria-label="每日路线控制">
        <div class="route-segment-tabs" aria-label="行程段快速定位">
          <button type="button" data-zoom-city="All">全程</button>
          <button type="button" data-zoom-city="武汉">武汉</button>
          <button type="button" data-zoom-city="宜昌">宜昌</button>
        </div>
        <label class="candidate-toggle">
          <input type="checkbox" id="show-candidates-toggle">
          <span>显示可加入候选 POI</span>
        </label>
        <div class="day-mode-note" id="day-mode-note">选择某一天后，按编号查看当天顺序和已经安排的地点。</div>
      </div>
      <div class="day-list" id="day-list" aria-live="polite"></div>

      <div class="section-title poi-list-section-title">地点速查清单</div>
      <div class="poi-list-tools" aria-label="地点速查筛选">
        <input class="poi-list-search" id="poi-list-search" type="search" placeholder="搜索地点、中文名、街区、关键词">
        <div class="poi-list-filter-grid">
          <select class="poi-list-select" id="poi-list-city" aria-label="按城市筛选"></select>
          <select class="poi-list-select" id="poi-list-category" aria-label="按类别筛选"></select>
          <select class="poi-list-select" id="poi-list-priority" aria-label="按优先级筛选"></select>
          <select class="poi-list-select" id="poi-list-plan" aria-label="按行程归类筛选"></select>
        </div>
      </div>
      <div class="poi-list-meta">
        <span id="poi-list-count">0 个地点</span>
        <button type="button" class="poi-list-clear" id="poi-list-clear">清空筛选</button>
      </div>
      <div class="poi-list" id="poi-list" aria-live="polite"></div>
      </div>
      <section class="sidebar-panel poi-detail-panel" id="poi-detail-panel" aria-live="polite" hidden>
        <nav class="poi-detail-day-rail" aria-label="按日期切换行程">
          <button type="button" class="poi-detail-overview" id="poi-detail-overview" aria-label="返回公开样例总览" title="返回公开样例总览">
            <span aria-hidden="true">←</span>
            <small>总览</small>
          </button>
          <div class="poi-detail-day-rail-list" id="poi-detail-day-rail"></div>
        </nav>
        <section class="poi-detail-day-list-panel" aria-label="当天安排">
          <header class="poi-detail-day-list-header">
            <strong id="poi-detail-day-heading">当天安排</strong>
            <span id="poi-detail-day-summary">请选择日期</span>
          </header>
          <div class="poi-detail-day-list" id="poi-detail-day-list"></div>
        </section>
        <div class="poi-detail-main">
          <header class="poi-detail-header">
            <div class="poi-detail-heading">
              <div class="poi-detail-kicker" id="poi-detail-kicker"></div>
              <div class="poi-detail-title" id="poi-detail-title"></div>
              <span class="poi-detail-original" id="poi-detail-original"></span>
            </div>
            <div class="poi-detail-itinerary-controls" id="poi-detail-itinerary-controls" aria-label="行程归类"></div>
          </header>
          <div id="poi-detail-content">
            <div class="poi-detail-empty">选择当天安排或地图上的地点查看详情</div>
          </div>
        </div>
      </section>
    </aside>
      </div>
      <div class="mobile-sheet-footer" aria-label="行程修改工具">
        <button type="button" id="mobile-candidates-action" data-mobile-view="candidates">顺路备选</button>
        <button type="button" id="mobile-undo-action" disabled>撤销上一步</button>
        <button type="button" id="mobile-change-summary-action" aria-expanded="false">修改汇总</button>
        <button type="button" id="mobile-replan-action">请 Codex 重新安排</button>
      </div>
      <section class="mobile-change-summary" id="mobile-change-summary" aria-live="polite" hidden>
        <h2>修改汇总</h2>
        <p id="mobile-change-summary-meta">还没有修改行程。</p>
        <ul id="mobile-change-summary-list"></ul>
        <textarea class="mobile-replan-fallback" id="mobile-replan-fallback" aria-label="可手动复制的完整重新安排请求" readonly hidden></textarea>
      </section>
    </section>

    <div id="map" role="application" aria-label="公开旅行路线地图"></div>
  </main>

      return typeof value === "string" && /^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(value);
    }

    function isTravelerVisibleEvent(event) {
      return Boolean(event)
        && isSlugSafeEventId(event.id)
        && event.status !== "historical-lead";
    }

    function isUsableEventCoords(coords) {
      return Array.isArray(coords)
        && coords.length === 2
        && Number.isFinite(coords[0])
        && Number.isFinite(coords[1])
        && coords[0] >= -90
        && coords[0] <= 90
        && coords[1] >= -180
        && coords[1] <= 180;
    }

    function buildRuntimeEventPois(events, sourcePois) {
      const availablePois = Array.isArray(sourcePois) ? sourcePois : [];
      return (Array.isArray(events) ? events : []).flatMap((event) => {
        if (!isTravelerVisibleEvent(event) || event.scope !== "venue") {
          return [];
        }
        const venue = event.venuePoiId
          ? availablePois.find((item) => item.id === event.venuePoiId)
          : null;
        const coords = isUsableEventCoords(event.coords) ? event.coords : venue?.coords;
        if (!isUsableEventCoords(coords)) {
          return [];
        }
        return [{
          id: `event:${event.id}`,
          name: event.name,
          name_zh: event.name_zh || event.name,
          zh: event.name_zh || event.name,
          city: event.city,
          area: event.area || venue?.area || "活动场地",
          category: "event",
          priority: event.status === "confirmed" ? "preferred" : "pending",
          coords,
          note: event.whyWorthIt,
          whyWorthIt: event.whyWorthIt,
          plan: event.plan,
          tip: event.tip,
          officialUrl: safePublicUrl(event.officialUrl),
          imageQuery: `${event.name} ${event.city}`,
          eventId: event.id,
          eventStatus: event.status,
          eventScope: event.scope,
          eventStartsAt: event.startsAt,
          eventEndsAt: event.endsAt,
          eventAffectedCities: Array.isArray(event.affectedCities) ? event.affectedCities.filter((city) => typeof city === "string") : []
        }];
      });
    }

    function normalizeCalendarDate(year, month, day) {
      const yearNumber = Number(year);
      const monthNumber = Number(month);
      const dayNumber = Number(day);
      if (!Number.isInteger(yearNumber) || !Number.isInteger(monthNumber) || !Number.isInteger(dayNumber)) return "";
      const date = new Date(Date.UTC(yearNumber, monthNumber - 1, dayNumber));
      if (
        date.getUTCFullYear() !== yearNumber
        || date.getUTCMonth() !== monthNumber - 1
        || date.getUTCDate() !== dayNumber
      ) return "";
      return `${String(yearNumber).padStart(4, "0")}-${String(monthNumber).padStart(2, "0")}-${String(dayNumber).padStart(2, "0")}`;
    }

    function getDayIsoDate(day, tripStartDate) {
      const isoMatch = /^(\d{4})-(\d{2})-(\d{2})(?:\D|$)/.exec(day?.date || "");
      if (isoMatch) return normalizeCalendarDate(isoMatch[1], isoMatch[2], isoMatch[3]);
      const year = /^(\d{4})-/.exec(tripStartDate || "")?.[1];
      if (!year) return "";
      for (const value of [day?.short, day?.date]) {
        const shortMatch = /^(\d{1,2})[/-](\d{1,2})(?:\D|$)/.exec(value || "");
        if (shortMatch) return normalizeCalendarDate(year, shortMatch[1], shortMatch[2]);
      }
      return "";
    }

    function getEventIsoDate(value) {
      const match = /^(\d{4})-(\d{2})-(\d{2})(?:\D|$)/.exec(value || "");
      return match ? normalizeCalendarDate(match[1], match[2], match[3]) : "";
    }

    function eventMatchesDayCity(eventLike, dayCity) {
      if (typeof dayCity !== "string" || !dayCity.trim() || dayCity === "Transit") return false;
      const target = dayCity.trim().toLocaleLowerCase("en-US");
      const affectedCities = eventLike?.eventAffectedCities ?? eventLike?.affectedCities;
      return [eventLike?.city, ...(Array.isArray(affectedCities) ? affectedCities : [])]
        .filter((city) => typeof city === "string" && city.trim())
        .some((city) => city.trim().toLocaleLowerCase("en-US") === target);
    }

    function isEventAssignable(item, day, tripStartDate) {
      if (item?.category !== "event") return true;
      if (item.eventStatus !== "confirmed" || item.eventScope !== "venue") return false;
      const dayDate = getDayIsoDate(day, tripStartDate);
      const startsOn = getEventIsoDate(item.eventStartsAt);
      const endsOn = getEventIsoDate(item.eventEndsAt);
      return Boolean(dayDate && startsOn && endsOn)
        && eventMatchesDayCity(item, day?.city)
        && startsOn <= dayDate
        && dayDate <= endsOn;
    }

    function sanitizeEventAssignments(assignments, items, days, tripStartDate) {
      const itemById = new Map((Array.isArray(items) ? items : []).map((item) => [item.id, item]));
      const dayById = new Map((Array.isArray(days) ? days : []).map((day) => [day.id, day]));
      return Object.fromEntries(Object.entries(assignments || {}).filter(([poiId, assignment]) => {
        const item = itemById.get(poiId);
        if (!item) return !poiId.startsWith("event:");
        return isEventAssignable(item, dayById.get(assignment?.dayId), tripStartDate);
      }));

      const response = await fetch(`https://commons.wikimedia.org/w/rest.php/v1/search/page?${params.toString()}`);

      let hash = 2166136261;
      for (let index = 0; index < value.length; index += 1) {
        hash ^= value.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      const unsignedHash = hash >>> 0;
      return {
        shapeClass: `marker-shape-${unsignedHash % 5}`,
        toneClass: `marker-tone-${Math.floor(unsignedHash / 5) % 5}`,
      };
    }

    function escapePoiMarkerAttribute(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderPoiMarkerMarkup({
      item,
      scheduled = false,
      currentDay = false,
      pendingReroute = false,
      candidate = false,
      selected = false,
      mainHtml = "",
      scheduleCategoryHtml = "",
      priorityBadgeHtml = "",
      selectedLabelHtml = "",
      title = "",
    }) {
      const variant = getPoiMarkerVariant(item?.id);
      const eventStatusClass = item?.category === "event"
        && ["confirmed", "announced", "program-pending"].includes(item?.eventStatus)
        ? `event-status-${item.eventStatus}`
        : "";
      const classes = [
        "poi-marker",
        scheduled ? "scheduled" : "",
        currentDay ? "current-day" : "",
        pendingReroute ? "pending-reroute" : "",
        item?.category || "",
        candidate ? "candidate" : "",
        selected ? "selected" : "",
        eventStatusClass,
        variant.shapeClass,
        variant.toneClass,
      ].filter(Boolean).join(" ");
      return `<div class="${classes}" data-poi-marker-id="${escapePoiMarkerAttribute(item?.id)}" title="${escapePoiMarkerAttribute(title)}"><span class="poi-marker-surface">${mainHtml}</span>${scheduleCategoryHtml}${priorityBadgeHtml}${selectedLabelHtml}</div>`;
    }
    /* POI_MARKER_RUNTIME_PURE_END */

    const map = L.map("map", {
      zoomControl: true,
      scrollWheelZoom: true
    });
    window.tripMap = map;

    L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}", {
      subdomains: ["1", "2", "3", "4"],
      maxZoom: 18,
      attribution: "© 高德地图"
    }).addTo(map);

    const palette = {
      flight: "#2f73d9",
      rail: "#d86828",
      local: "#228b6e"
    };

    const markerIcon = (color, label) => L.divIcon({
      className: "number-marker",
      html: `<div style="display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:${color};color:#fff;border:2px solid #fff;box-shadow:0 2px 9px rgba(22,32,42,.25);font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">${label}</div>`,
      iconSize: [30, 30],
      iconAnchor: [15, 15],
      popupAnchor: [0, -13]
    });

    const poiIcon = (item) => {
      const meta = poiCategories[item.category];
      const zhName = getZhName(item);
      const priority = priorities[item.id];
      const priorityBadge = priority ? `<span class="priority-badge">${priority}</span>` : "";
      const assignment = getPoiAssignment(item.id);
      const isCandidate = getVisibleDay() && isCandidateForSelectedDay(item);
      const isSelected = activePoiDetailId === item.id;
      const selectedLabel = isSelected
        ? `<span class="poi-marker-label">${escapeHtml(zhName)}</span>`
        : "";
      if (assignment) {
        const isCurrentDay = getVisibleDay()?.id === assignment.dayId;
        const showScheduledOrder = isCurrentDay && Number(assignment.order) > 0;
        const scheduledMainLabel = showScheduledOrder ? String(assignment.order) : meta.short;
        const scheduledCategoryBadge = showScheduledOrder
          ? `<span class="schedule-category" aria-hidden="true">${escapeHtml(meta.short)}</span>`
          : "";
        return L.divIcon({
          className: "",
          html: renderPoiMarkerMarkup({
            item,
            scheduled: true,
            currentDay: isCurrentDay,
            pendingReroute: Boolean(itineraryPlan.dirtyDays[assignment.dayId]),
            selected: isSelected,
            mainHtml: `<span class="schedule-main">${escapeHtml(scheduledMainLabel)}</span>`,
            scheduleCategoryHtml: scheduledCategoryBadge,
            priorityBadgeHtml: priorityBadge,
            selectedLabelHtml: selectedLabel,
            title: `${zhName} · ${getPoiPlanLabel(item)} · ${poiCategories[item.category].label}`,
          }),
          iconSize: isCurrentDay ? [28, 28] : [26, 26],
          iconAnchor: isCurrentDay ? [14, 14] : [13, 13],
          popupAnchor: [0, isCurrentDay ? -14 : -13]
        });
      }

      return L.divIcon({
        className: "",
        html: renderPoiMarkerMarkup({
          item,
          candidate: isCandidate,
          selected: isSelected,
          mainHtml: `<span class="poi-marker-main">${escapeHtml(meta.short)}</span>`,
          priorityBadgeHtml: priorityBadge,
          selectedLabelHtml: selectedLabel,
          title: `${zhName} · ${meta.label}`,
        }),
        iconSize: item.category === "top50" ? [28, 28] : [24, 24],
        iconAnchor: item.category === "top50" ? [14, 14] : [12, 12],
        popupAnchor: [0, item.category === "top50" ? -14 : -12]
      });
    };

    const popupHtml = (item) => `
      <p class="popup-title">${item.name}</p>
      <div class="popup-date">${item.date}</div>
      <div class="popup-note">${item.note}</div>
    `;

    const poiDetailItineraryControlsHtml = (item) => {
      const assignment = getPoiAssignment(item.id);
      const selectedPriority = priorities[item.id] || "";
      const eligibleDays = itineraryDays
        .filter((day) => day.city !== "Transit")
        .filter((day) => isEventAssignable(item, day, PUBLIC_TRIP_DATA.trip.startDate));
      const assignable = item.category !== "event" || eligibleDays.length > 0;
      const dayOptions = assignable ? eligibleDays
        .map((day) => `<option value="${day.id}" ${assignment?.dayId === day.id ? "selected" : ""}>${escapeHtml(day.short)} · ${escapeHtml(cityLabels[day.city] || day.city)}</option>`)
        .join("") : "";
      const priorityButtons = priorityLevels.map((level) => `
        <button type="button" class="priority-btn ${selectedPriority === level ? "active" : ""}" data-priority="${level}" data-poi-id="${item.id}" aria-label="标记为${priorityNaturalLabels[level]}"><span class="desktop-priority-label">${level}</span><span class="mobile-priority-label">${priorityNaturalLabels[level]}</span></button>
      `).join("");
      return `
        <div class="poi-detail-control-row">
          <span class="poi-detail-control-label">行程</span>
          <select class="poi-list-select" data-move-poi="${item.id}" aria-label="${assignable ? (assignment ? "移动到其他日期" : "安排到某一天") : getEventWaitingCopy(item)}" ${assignable ? "" : "disabled"}>
            <option value="">${assignable ? (assignment ? "移动到日期..." : "安排到日期...") : getEventWaitingCopy(item)}</option>
            ${dayOptions}
          </select>
        </div>
        <div class="poi-detail-control-row">
          <span class="poi-detail-control-label">优先级</span>
          <div class="poi-detail-priority-buttons">
            ${priorityButtons}
            <button type="button" class="priority-btn clear ${selectedPriority ? "" : "active"}" data-priority="" data-poi-id="${item.id}" aria-label="清除优先级">清除</button>
          </div>
        </div>
      `;
    };

    const renderPoiDetailSections = (item) => {
      if (!Array.isArray(item.detailSections)) return "";
      return item.detailSections.map((section) => {
        const title = typeof section?.title === "string" ? section.title.trim() : "";
        const body = typeof section?.body === "string" ? section.body.trim() : "";
        const items = Array.isArray(section?.items)
          ? section.items.filter((entry) => typeof entry === "string" && entry.trim()).slice(0, 5)
          : [];
        if (!title || (!body && !items.length)) return "";
        const bodyHtml = body ? `<p>${escapeHtml(body)}</p>` : "";
        const itemsHtml = items.length
          ? `<ul class="poi-detail-list">${items.map((entry) => `<li>${escapeHtml(entry)}</li>`).join("")}</ul>`
          : "";
        return `
          <section class="poi-detail-section">
            <h2>${escapeHtml(title)}</h2>
            ${bodyHtml}${itemsHtml}
          </section>
        `;
      }).join("");
    };

    const renderHostedEvents = (item) => renderHostedEventsForItem(tripEvents, item);

    const poiDetailHtml = (item) => {
      const meta = poiCategories[item.category];
      const officialLabel = safePublicUrl(item.officialUrl || officialUrls[item.name]) ? "打开官网" : "官网搜索";
      const urls = getResourceUrls(item);
      const assignment = getPoiAssignment(item.id);
      const itineraryLine = assignment
        ? escapeHtml(getPoiPlanLabel(item))
        : "未安排候选 POI";
      const sourceSection = renderPoiSourceEvidence(item);
      const detailSectionsHtml = renderPoiDetailSections(item);
      const detailEventSectionsHtml = composePoiDetailEventSections(detailSectionsHtml, renderHostedEvents(item));

      return `
        <div class="poi-detail-context">${itineraryLine} · ${escapeHtml(cityLabels[item.city] || item.city)} · ${escapeHtml(item.area)} · ${escapeHtml(meta.label)}</div>
        <section class="poi-detail-section">
          <h2>照片</h2>
          <div class="resource-status" id="poi-detail-image-status">正在加载同页图片预览...</div>
          <div class="image-preview-viewer" id="poi-detail-image-viewer"></div>
          <div class="image-preview-grid" id="poi-detail-image-preview"></div>
          <div class="poi-detail-actions">
            <a href="${urls.images}" target="_blank" rel="noopener noreferrer">更多图片</a>
            <a href="${urls.xhs}" target="_blank" rel="noopener noreferrer">小红书</a>
            <a href="${urls.map}" target="_blank" rel="noopener noreferrer">外部地图</a>
            ${urls.official ? `<a href="${escapeHtml(urls.official)}" target="_blank" rel="noopener noreferrer">${officialLabel}</a>` : ""}
          </div>
        </section>
        <section class="poi-detail-section">
          <h2>为什么值得去</h2>
          <p>${escapeHtml(item.whyWorthIt || item.note)}</p>
        </section>
        ${detailEventSectionsHtml}
        <section class="poi-detail-section">
          <h2>怎么安排</h2>
          <p>${escapeHtml(item.plan || categoryPlans[item.category])}</p>
        </section>
        <section class="poi-detail-section">
          <h2>注意事项</h2>
          <p>${escapeHtml(item.tip || categoryTips[item.category])}</p>
        </section>
        ${sourceSection}
        <div class="poi-detail-meta">规划级近似定位 · 预约前复核精确地址和营业时间</div>
      `;
    };

    const flightLayer = L.layerGroup();
    const mainLayer = L.layerGroup();
    const localLayer = L.layerGroup();
    const itineraryLayer = L.layerGroup();
    const poiLayers = Object.fromEntries(
      Object.keys(poiCategories).map((category) => [category, L.layerGroup()])
    );
    const poiBoundsByCity = new Map();
    const categoryLayerLabel = (category) => {
      const meta = poiCategories[category];
      const count = pois.filter((item) => item.category === category).length;
      return `${meta.short} | ${meta.label} (${count})`;
    };
    const overlayDefinitions = [
      { key: "flight", label: "航班 / 跨境移动", layer: flightLayer },
      { key: "main", label: "主线城市", layer: mainLayer },
      { key: "local", label: "短途 day trip", layer: localLayer },
      { key: "itinerary", label: `每日路线 (${itineraryDays.length})`, layer: itineraryLayer },
      { key: "hotel", label: () => categoryLayerLabel("hotel"), layer: poiLayers.hotel },
      { key: "top50", label: () => categoryLayerLabel("top50"), layer: poiLayers.top50 },
      { key: "wine", label: () => categoryLayerLabel("wine"), layer: poiLayers.wine },
      { key: "sweet", label: () => categoryLayerLabel("sweet"), layer: poiLayers.sweet },
      { key: "coffee", label: () => categoryLayerLabel("coffee"), layer: poiLayers.coffee },
      { key: "food", label: () => categoryLayerLabel("food"), layer: poiLayers.food },
      { key: "art", label: () => categoryLayerLabel("art"), layer: poiLayers.art },
      { key: "localLife", label: () => categoryLayerLabel("local-life"), layer: poiLayers["local-life"] },
      { key: "sight", label: () => categoryLayerLabel("sight"), layer: poiLayers.sight },
      { key: "event", label: () => categoryLayerLabel("event"), layer: poiLayers.event }
    ];
    const layerKeyByLeafletId = new Map();

    const extendPoiBounds = (key, coords) => {
      if (!poiBoundsByCity.has(key)) {
        poiBoundsByCity.set(key, L.latLngBounds([coords]));
        return;
      }
      poiBoundsByCity.get(key).extend(coords);
    };

    const mainRoute = ["paris", "nice", "barcelona", "seville"];
    const outboundFlight = [];
    const returnFlight = [];

    for (const stop of stops) {
      const color = stop.kind === "flight" ? palette.flight : palette.rail;
      L.marker(stop.coords, { icon: markerIcon(color, stop.order) })
        .bindPopup(popupHtml(stop))
        .addTo(stop.kind === "flight" ? flightLayer : mainLayer);
    }

    for (const item of localStops) {
      L.circleMarker(item.coords, {
        radius: 7,
        color: "#fff",
        weight: 2,
        fillColor: palette.local,
        fillOpacity: 0.95
      }).bindPopup(popupHtml(item)).addTo(localLayer);
    }

    const itineraryRouteEntries = new Map();
    const dayBoundsByCity = new Map();
    let daySequenceGuide = null;

    const itineraryPopupHtml = (day, event, index) => `
      <p class="popup-title">${escapeHtml(day.short)} · ${escapeHtml(event.title)}</p>
      <div class="popup-date">${escapeHtml(day.date)} · 第 ${index + 1} 站 · ${escapeHtml(event.time)}</div>
      <div class="popup-note"><strong>${escapeHtml(day.title)}</strong></div>
      <div class="popup-note">${escapeHtml(event.note)}</div>
      <div class="popup-meta">编号只表示行程先后 · 不代表实际道路路线 · 出发前复核预约、交通和活动节目</div>
    `;

    const dayMarkerIcon = (day, index, active = false) => L.divIcon({
      className: "",
      html: `
        <div class="day-route-marker ${active ? "active" : "overview"}" style="background:${day.color};">
          ${active ? "" : `<span class="day-route-date">${escapeHtml(day.short)}</span>`}
          <span class="day-route-order">${index + 1}</span>
        </div>
      `,
      iconSize: active ? [34, 34] : [48, 24],
      iconAnchor: active ? [17, 17] : [24, 12],
      popupAnchor: [0, active ? -15 : -11]
    });

    const extendDayBounds = (city, bounds) => {
      if (!city || city === "Transit") {
        return;
      }
      if (!dayBoundsByCity.has(city)) {
        dayBoundsByCity.set(city, L.latLngBounds(bounds.getSouthWest(), bounds.getNorthEast()));
        return;
      }
      dayBoundsByCity.get(city).extend(bounds);
    };

    for (const day of itineraryDays) {
      const points = day.events.map((event) => event.coords);
      const dayBounds = L.latLngBounds(points);
      const focusFromEventIndex = Number.isInteger(day.focusFromEventIndex) ? day.focusFromEventIndex : 0;
      const focusBounds = L.latLngBounds(points.slice(focusFromEventIndex));
      const markers = day.events.map((event, index) => L.marker(event.coords, {
        icon: dayMarkerIcon(day, index)
      }).bindPopup(itineraryPopupHtml(day, event, index)).addTo(itineraryLayer));

      itineraryRouteEntries.set(day.id, { day, markers, bounds: dayBounds, focusBounds, focusFromEventIndex });
      extendDayBounds(day.city, dayBounds);
    }

    const syncDaySequenceGuide = () => {
      if (daySequenceGuide) {
        itineraryLayer.removeLayer(daySequenceGuide);
        daySequenceGuide = null;
      }

      const dayId = appState.dayView.selectedDayId;
      if (!dayId) {
        return;
      }

      const points = getDayPois(dayId)
        .filter(({ item, assignment }) => item.category !== "hotel" && Number(assignment.order) > 0)
        .map(({ item }) => item.coords);
      if (points.length < 2) {
        return;
      }

      daySequenceGuide = L.polyline(points, {
        color: shouldCollapseLayerControl(window.innerWidth) ? "#0f766e" : "#64748b",
        weight: 2,
        opacity: 0.72,
        dashArray: "6 8",
        lineCap: "round",
        lineJoin: "round",
        interactive: false
      }).addTo(itineraryLayer);
    };

    for (const item of pois) {
      const marker = L.marker(item.coords, {
        icon: poiIcon(item),
        zIndexOffset: 1000,
        riseOnHover: true,
        riseOffset: 1500
      })
        .addTo(poiLayers[item.category]);
      markerByPoiId.set(item.id, { item, marker });
      marker.on("click", () => {
        openPoiDetail(item.id);
      });

      extendPoiBounds(item.city, item.coords);
      if (item.category === "wine") {
        extendPoiBounds("Wine Trips", item.coords);
      }
    }

    document.getElementById("poi-count").textContent = String(pois.length);

    const dayList = document.getElementById("day-list");
    const showCandidatesToggle = document.getElementById("show-candidates-toggle");
    const dayModeNote = document.getElementById("day-mode-note");
    const cityKeyByStopId = {
      wuhan: "武汉",
      yichang: "宜昌"
    };

    const transitModeMeta = {
      walk: { icon: "↓", label: "步行" },
      transit: { icon: "◉", label: "公共交通" },
      taxi: { icon: "→", label: "出租车" },
      train: { icon: "▣", label: "火车" },
      flight: { icon: "↗", label: "飞机" },
      wait: { icon: "◷", label: "等待 / 原地活动" }
    };

    const renderTransitToNext = (transit) => {
      if (!transit) {
        return "";
      }
      const meta = transitModeMeta[transit.mode] || transitModeMeta.transit;
      const metrics = [transit.distance, transit.duration].filter(Boolean).join("｜");
      const headline = [meta.label, transit.summary, metrics].filter(Boolean).join("｜");
      const safeHeadline = escapeHtml(headline);
      return `
        <details class="day-transit">
          <summary aria-label="展开交通详情：${safeHeadline}">
            <span class="day-transit-icon" aria-hidden="true">${meta.icon}</span>
            <span class="day-transit-main">${safeHeadline}</span>
          </summary>
          <div class="day-transit-detail">${escapeHtml(transit.detail)}</div>
        </details>
      `;
    };

    const renderCityEventNotices = (day) => renderCityEventNoticesForDay(
      tripEvents,
      day,
      PUBLIC_TRIP_DATA.trip.startDate
    );

    const renderDayList = () => {
      dayList.innerHTML = itineraryDays.map((day, index) => {
        const previousDay = itineraryDays[index - 1];
        const groupLabel = !previousDay || previousDay.city !== day.city
          ? `<div class="mobile-day-group"><strong>${escapeHtml(cityLabels[day.city] || day.city)}</strong><span>${escapeHtml(day.date)}</span></div>`
          : "";
        return `${groupLabel}
        <div class="day-card ${appState.dayView.selectedDayId === day.id ? "active" : ""}" style="--day-color:${day.color};" data-day-card="${day.id}">
          <button type="button" class="day-card-open" data-open-day="${day.id}" data-mobile-view="day" aria-pressed="${appState.dayView.selectedDayId === day.id}" aria-label="${appState.dayView.selectedDayId === day.id ? `取消选择 ${day.short}` : `选择 ${day.short}`}：${escapeHtml(day.title)}">
            <span class="day-card-date">${escapeHtml(day.date)} · ${escapeHtml(cityLabels[day.city] || day.city)}</span>
            <span class="day-card-title">${escapeHtml(day.title)}</span>
            <span class="day-card-summary">${escapeHtml(day.summary)}</span>
          </button>
          <div class="day-card-events">
            ${day.events.map((event) => `
              <span class="day-card-event"><span>${escapeHtml(event.time)}</span><strong>${escapeHtml(event.title)}</strong></span>
              ${renderTransitToNext(event.transitToNext)}
            `).join("")}
          </div>
        </div>`;
      }).join("");
    };

    const highlightItineraryDay = (dayId) => {
      appState.dayView.selectedDayId = dayId;
      appState.activeDayId = dayId;
      renderDayList();
      saveAppState();
    };

    const ensureItineraryLayer = () => {
      if (!map.hasLayer(itineraryLayer)) {
        itineraryLayer.addTo(map);
        appState.layers.itinerary = true;
      }
    };

    const fitBoundsIfValid = (targetBounds, maxZoom = 13) => {
      if (!targetBounds || !targetBounds.isValid()) {
        return;
      }
      const options = { animate: false, maxZoom };
      if (shouldCollapseLayerControl(window.innerWidth)) {
        options.paddingBottomRight = [0, Math.round(window.innerHeight * 0.56)];
      }
      map.fitBounds(targetBounds.pad(0.18), options);
    };

    const openDayRoute = (dayId) => {
      const entry = itineraryRouteEntries.get(dayId);
      if (!entry) {
        return;
      }
      ensureItineraryLayer();
      map.closePopup();
      appState.dayView.selectedDayId = dayId;
      appState.activeDayId = dayId;
      refreshItineraryView();
      fitBoundsIfValid(entry.focusBounds, entry.focusFromEventIndex > 0 ? 14 : entry.day.travel ? 7 : 14);
      enterDetailBrowse();
      setMobileViewMode("day", { sheetSnap: "compact" });
      renderDetailNavigation();
      if (!activePoiDetailId) {
        renderPoiDetailEmpty();
      }
      saveAppState();
    };

    const getAllItineraryBounds = () => {
      const allBounds = L.latLngBounds([]);
      for (const entry of itineraryRouteEntries.values()) {
        allBounds.extend(entry.bounds);
      }
      return allBounds;
    };

    const getNearestMainCity = () => {
      const center = map.getCenter();
      let best = null;
      for (const stop of stops) {
        const cityKey = cityKeyByStopId[stop.id];
        if (!cityKey) {
          continue;
        }
        const distance = map.distance(center, L.latLng(stop.coords));
        if (!best || distance < best.distance) {
          best = { cityKey, distance };
        }
      }
      return best?.cityKey || "武汉";
    };

    const syncDayControls = () => {
      showCandidatesToggle.checked = Boolean(appState.dayView.showCandidates);
      const selectedDay = getVisibleDay();
      if (!selectedDay) {
        dayModeNote.textContent = "上方行程段用于快速定位；点击下方某一天进入当天专注视图，再次点击可取消选择。";
        return;
      }
      if (selectedDay.city === "Transit") {
        dayModeNote.textContent = `${selectedDay.short} 是交通日，地图只显示机场/转机/移动节点；速查清单自动显示全部地点。`;
        return;
      }
      const dayPois = getDayPois(selectedDay.id);
      const candidatePois = getDayCandidatePois(selectedDay.id, dayPois).items.length;
      const cityEventNoticeCount = getCityEventsForDay(
        tripEvents,
        selectedDay,
        PUBLIC_TRIP_DATA.trip.startDate
      ).length;
      const sequenceNote = hasNumberedPoisForDay(selectedDay.id)
        ? "地图用小圆数字和顺序引导线表示当天先后；引导线不代表实际道路，完整交通见下方时间线。"
        : "地图用大圆数字表示当天行程节点。";
      dayModeNote.textContent = `${selectedDay.short} 当前安排：${formatScheduledPlacesSummary(dayPois)}；${formatCityEventNoticeSummary(cityEventNoticeCount) ? `${formatCityEventNoticeSummary(cityEventNoticeCount)}；` : ""}${appState.dayView.showCandidates ? `同时显示 ${candidatePois} 个同城候选。` : "候选地点已隐藏。"}再次点击该日期可取消选择。${sequenceNote}`
    };

    const setItineraryVisibility = () => {
      const selectedDayId = appState.dayView.selectedDayId;
      for (const [id, entry] of itineraryRouteEntries) {
        const visible = !selectedDayId || id === selectedDayId;
        const showEventMarkers = !selectedDayId || id !== selectedDayId || !hasNumberedPoisForDay(id);
        if (visible) {
          entry.markers.forEach((marker, index) => {
            marker.setIcon(dayMarkerIcon(entry.day, index, id === selectedDayId));
            if (showEventMarkers) {
              if (!itineraryLayer.hasLayer(marker)) {
                itineraryLayer.addLayer(marker);
              }
            } else if (itineraryLayer.hasLayer(marker)) {
              itineraryLayer.removeLayer(marker);
            }
          });
        } else {
          for (const marker of entry.markers) {
            itineraryLayer.removeLayer(marker);
          }
        }
      }
    };

    const updatePoiMarkerVisibility = () => {
      for (const { item, marker } of markerByPoiId.values()) {
        const layer = poiLayers[item.category];
        marker.setIcon(poiIcon(item));
        marker.setZIndexOffset(item.id === activePoiDetailId ? 3000 : 1000);
        if (item.id === activePoiDetailId || shouldShowPoiInCurrentView(item)) {
          if (!layer.hasLayer(marker)) {
            layer.addLayer(marker);
          }
        } else if (layer.hasLayer(marker)) {
          layer.removeLayer(marker);
        }
      }
    };

    const ensureVisiblePoiCategoryLayers = () => {
      if (!getVisibleDay()) {
        return;
      }
      for (const [category, layer] of Object.entries(poiLayers)) {
        const hasVisiblePoi = pois.some((item) => item.category === category && shouldShowPoiInCurrentView(item));
        if (hasVisiblePoi && !map.hasLayer(layer)) {
          layer.addTo(map);
          appState.layers[categoryLayerKeys[category]] = true;
        }
      }
    };

    const refreshItineraryView = () => {
      const selectedDay = getVisibleDay();
      visibleDayCandidateIds = selectedDay
        ? new Set(getDayCandidatePois(selectedDay.id, getDayPois(selectedDay.id)).items.map((item) => item.id))
        : new Set();
      setItineraryVisibility();
      syncDaySequenceGuide();
      ensureVisiblePoiCategoryLayers();
      updatePoiMarkerVisibility();
      renderDayList();
      renderPoiList();
      syncDayControls();
    };

    if (appState.activeDayId && !appState.dayView.selectedDayId) {
      appState.dayView.selectedDayId = appState.activeDayId;
    }
    if (appState.dayView.selectedDayId) {
      ensureItineraryLayer();
    }

    dayList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-open-day]");
      if (!button) {
        return;
      }
      const dayId = button.getAttribute("data-open-day");
      openDayRoute(dayId);
    });

    const showAllItineraryRoutes = ({ fit = false } = {}) => {
      ensureItineraryLayer();
      delete appState.activeDayId;
      appState.dayView.selectedDayId = "";
      for (const entry of itineraryRouteEntries.values()) {
        for (const marker of entry.markers) {
          if (!itineraryLayer.hasLayer(marker)) {
            itineraryLayer.addLayer(marker);
          }
        }
      }
      refreshItineraryView();
      if (fit) {
        fitBoundsIfValid(getAllItineraryBounds(), 5);
      }
      saveAppState();
    };

    const showCityItinerarySegment = (cityKey) => {
      ensureItineraryLayer();
      delete appState.activeDayId;
      appState.dayView.selectedDayId = "";
      for (const entry of itineraryRouteEntries.values()) {
        for (const marker of entry.markers) {
          if (!itineraryLayer.hasLayer(marker)) {
            itineraryLayer.addLayer(marker);
          }
        }
      }
      updatePoiMarkerVisibility();
      renderDayList();
      renderPoiList();
      syncDayControls();
      fitBoundsIfValid(dayBoundsByCity.get(cityKey), 12);
      saveAppState();
    };

    const poiListSearch = document.getElementById("poi-list-search");
    const poiListCity = document.getElementById("poi-list-city");
    const poiListCategory = document.getElementById("poi-list-category");
    const poiListPriority = document.getElementById("poi-list-priority");
    const poiListPlan = document.getElementById("poi-list-plan");
    const poiListCount = document.getElementById("poi-list-count");
    const poiList = document.getElementById("poi-list");
    const poiListClear = document.getElementById("poi-list-clear");

    const setOptions = (select, options) => {
      select.innerHTML = options.map((option) => `
        <option value="${escapeHtml(option.value)}">${escapeHtml(option.label)}</option>
      `).join("");
    };

    setOptions(poiListCity, [
      { value: "", label: "全部城市" },
      ...Object.entries(cityLabels).map(([value, label]) => ({ value, label }))
    ]);
    setOptions(poiListCategory, [
      { value: "", label: "全部类别" },
      ...Object.entries(poiCategories).map(([value, meta]) => ({ value, label: meta.label }))
    ]);
    setOptions(poiListPriority, [
      { value: "", label: "全部优先级" },
      ...priorityLevels.map((level) => ({ value: level, label: `${level} 优先` })),
      { value: "none", label: "未标记" }
    ]);
    setOptions(poiListPlan, [
      { value: "current", label: "当前视图地点" },
      { value: "day", label: "当天已安排" },
      { value: "candidates", label: "当天候选" },
      { value: "scheduled", label: "全部已安排" },
      { value: "unscheduled", label: "全部未安排" },
      { value: "all", label: "全部地点" }
    ]);
    const normalizeForSearch = (value) => String(value || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");

    const syncPoiListControls = () => {
      poiListSearch.value = appState.poiList.search || "";
      poiListCity.value = appState.poiList.city || "";
      poiListCategory.value = appState.poiList.category || "";
      poiListPriority.value = appState.poiList.priority || "";
      poiListPlan.value = appState.poiList.plan || "current";
    };

    const getEffectivePoiListPlan = (plan) => {
      const selectedDay = getVisibleDay();
      const requestedPlan = plan || "current";
      if (!selectedDay && (requestedPlan === "day" || requestedPlan === "candidates")) {
        return "all";
      }
      if (selectedDay?.city === "Transit" && ["current", "day", "candidates"].includes(requestedPlan)) {
        return "all";
      }
      return requestedPlan;
    };

    const renderPoiList = () => {
      const state = {
        ...defaultPoiListState,
        ...(appState.poiList || {})
      };
      const effectivePlan = getEffectivePoiListPlan(state.plan);
      if (poiListPlan.value !== effectivePlan) {
        poiListPlan.value = effectivePlan;
      }
      const search = normalizeForSearch(state.search);
      const selectedDay = getVisibleDay();
      const nearbyCandidateResult = effectivePlan === "candidates" && selectedDay
        ? getDayCandidatePois(selectedDay.id, getDayPois(selectedDay.id))
        : null;
      const nearbyCandidateIds = nearbyCandidateResult
        ? new Set(nearbyCandidateResult.items.map((item) => item.id))
        : null;
      const filteredPois = pois.filter((item) => {
        const priority = priorities[item.id] || "";
        const assignment = getPoiAssignment(item.id);
        const searchable = normalizeForSearch([
          getZhName(item),
          item.name,
          item.city,
          cityLabels[item.city],
          item.area,
          poiCategories[item.category].label,
          item.note,
          getPoiPlanLabel(item)
        ].join(" "));

        if (effectivePlan === "current" && selectedDay && !shouldShowPoiInCurrentView(item)) {
          return false;
        }
