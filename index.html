        if (effectivePlan === "day" && (!selectedDay || assignment?.dayId !== selectedDay.id)) {
          return false;
        }
        if (effectivePlan === "candidates" && !nearbyCandidateIds?.has(item.id)) {
          return false;
        }
        if (effectivePlan === "scheduled" && !assignment) {
          return false;
        }
        if (effectivePlan === "unscheduled" && assignment) {
          return false;
        }
        if (search && !searchable.includes(search)) {
          return false;
        }
        if (state.city && item.city !== state.city) {
          return false;
        }
        if (state.category && item.category !== state.category) {
          return false;
        }
        if (state.priority === "none" && priority) {
          return false;
        }
        if (priorityLevels.includes(state.priority) && priority !== state.priority) {
          return false;
        }
        return true;
      });

      poiListCount.textContent = nearbyCandidateResult
        ? `${filteredPois.length} / ${nearbyCandidateResult.items.length} 个顺路备选`
        : `${filteredPois.length} / ${pois.length} 个地点`;
      if (!filteredPois.length) {
        poiList.innerHTML = '<div class="poi-list-empty">没有匹配地点，换个关键词或清空筛选。</div>';
        return;
      }

      poiList.innerHTML = filteredPois.map((item) => {
        const zhName = getZhName(item);
        const originalLine = zhName === item.name ? "" : `<span class="poi-list-original">${escapeHtml(item.name)}</span>`;
        const priority = priorities[item.id] || "";
        const assignment = getPoiAssignment(item.id);
        const selectedDay = getVisibleDay();
        const assignable = selectedDay && isEventAssignable(item, selectedDay, PUBLIC_TRIP_DATA.trip.startDate);
        const addToTodayButton = selectedDay && selectedDay.city !== "Transit" && assignment?.dayId !== selectedDay.id
          ? (assignable
            ? `<button type="button" class="poi-list-priority-btn" data-assign-day="${selectedDay.id}" data-poi-id="${item.id}" aria-label="${escapeHtml(zhName)} 加入今天">加</button>`
            : `<button type="button" class="poi-list-priority-btn" disabled aria-label="${escapeHtml(getEventWaitingCopy(item))}" title="${escapeHtml(getEventWaitingCopy(item))}">${escapeHtml(getEventWaitingCopy(item))}</button>`)
          : "";
        const removeButton = assignment
          ? `<button type="button" class="poi-list-priority-btn" data-remove-itinerary="${item.id}" aria-label="${escapeHtml(zhName)} 从行程移除">移</button>`
          : "";
        const priorityButtons = priorityLevels.map((level) => `
          <button type="button" class="poi-list-priority-btn ${priority === level ? "active" : ""}" data-priority="${level}" data-poi-id="${item.id}" aria-label="${escapeHtml(zhName)} 标记为${priorityNaturalLabels[level]}"><span class="desktop-priority-label">${level}</span><span class="mobile-priority-label">${priorityNaturalLabels[level]}</span></button>
        `).join("");
        const cachedImage = commonsImageCache.get(item.id)?.[0];
        const thumbnailHtml = cachedImage
          ? `<span class="poi-list-thumb" style="--place-color:${poiCategories[item.category].color};"><img src="${escapeHtml(cachedImage.thumb)}" alt="${escapeHtml(cachedImage.title)}" loading="lazy" decoding="async"></span>`
          : `<span class="poi-list-thumb" style="--place-color:${poiCategories[item.category].color};" aria-hidden="true">${escapeHtml(poiCategories[item.category].short)}</span>`;

        return `
          <div class="poi-list-item" data-poi-list-row="${item.id}">
            ${thumbnailHtml}
            <button type="button" class="poi-list-open" data-open-poi="${item.id}" data-mobile-view="detail">
              <span class="poi-list-name">${escapeHtml(zhName)}</span>
              ${originalLine}
              <span class="poi-list-sub">${escapeHtml(cityLabels[item.city] || item.city)} · ${escapeHtml(item.area)} · ${escapeHtml(poiCategories[item.category].label)}</span>
              <span class="poi-list-sub">${escapeHtml(getPoiPlanLabel(item))}</span>
            </button>
            <div class="poi-list-priorities" aria-label="优先级">
              ${addToTodayButton}
              ${removeButton}
              ${priorityButtons}
              <button type="button" class="poi-list-priority-btn ${priority ? "" : "active"}" data-priority="" data-poi-id="${item.id}" aria-label="${escapeHtml(zhName)} 清除优先级"><span class="desktop-priority-label">清</span><span class="mobile-priority-label">清除</span></button>
            </div>
          </div>
        `;
      }).join("");
    };

    const updatePoiListState = () => {
      appState.poiList = {
        search: poiListSearch.value.trim(),
        city: poiListCity.value,
        category: poiListCategory.value,
        priority: poiListPriority.value,
        plan: poiListPlan.value
      };
      renderPoiList();
      saveAppState();
    };

    function calculatePoiFocusZoom(currentZoom, mapSize) {
      const width = Number(mapSize?.x) || 0;
      const height = Number(mapSize?.y) || 0;
      const shortSide = Math.min(width || 680, height || 640);
      const baseZoom = shortSide < 480 ? 14 : shortSide < 760 ? 15 : 16;
      const normalizedCurrent = Number.isFinite(Number(currentZoom)) ? Number(currentZoom) : baseZoom;
      return Math.max(baseZoom, Math.min(normalizedCurrent, baseZoom + 1));
    }

    const focusPoiOnMap = (entry) => {
      requestAnimationFrame(() => {
        map.invalidateSize({ pan: false });
        const zoom = calculatePoiFocusZoom(map.getZoom(), map.getSize());
        map.setView(entry.item.coords, zoom, { animate: false });
        if (shouldCollapseLayerControl(window.innerWidth)) {
          const mapRect = map.getContainer().getBoundingClientRect();
          const appBarRect = document.getElementById("mobile-app-bar").getBoundingClientRect();
          const sheetRect = document.getElementById("mobile-bottom-sheet").getBoundingClientRect();
          const markerPoint = map.latLngToContainerPoint(entry.item.coords);
          const visibleTop = Math.max(mapRect.top, appBarRect.bottom);
          const visibleBottom = Math.min(mapRect.bottom, sheetRect.top);
          if (visibleBottom > visibleTop) {
            const markerPageY = mapRect.top + markerPoint.y;
            const panY = calculateMobilePoiFocusPanY(markerPageY, visibleTop, visibleBottom);
            map.panBy([0, panY], { animate: false });
          }
        }
      });
    };

    const openPoiFromList = (poiId) => {
      const entry = markerByPoiId.get(poiId);
      if (!entry) {
        return;
      }

      const layer = poiLayers[entry.item.category];
      const layerKey = categoryLayerKeys[entry.item.category];
      if (!map.hasLayer(layer)) {
        layer.addTo(map);
        appState.layers[layerKey] = true;
      }
      openPoiDetail(poiId, { focusMap: true });
    };

    const refreshPoiPresentation = (poiId, refreshDetail = false) => {
      const entry = markerByPoiId.get(poiId);
      if (!entry) {
        return;
      }
      entry.marker.setIcon(poiIcon(entry.item));
      if (refreshDetail && activePoiDetailId === poiId) {
        renderPoiDetail(entry.item, { preserveScroll: true });
      }
      if (!poiDetailPanel.hidden) {
        renderDetailNavigation();
      }
    };

    const markDaysForReroute = (...dayIds) => {
      for (const dayId of dayIds.filter(Boolean)) {
        itineraryPlan.dirtyDays[dayId] = true;
      }
    };

    const normalizeDayPoiOrders = (dayId) => {
      getDayPois(dayId)
        .filter(({ assignment }) => Number(assignment.order) > 0)
        .forEach(({ item }, index) => {
          itineraryPlan.assignments[item.id] = { dayId, order: index + 1 };
        });
    };

    const reorderDayPois = (dayId, orderedPoiIds) => {
      const currentPoiIds = getDayPois(dayId)
        .filter(({ assignment }) => Number(assignment.order) > 0)
        .map(({ item }) => item.id);
      if (
        currentPoiIds.length !== orderedPoiIds.length
        || currentPoiIds.some((poiId) => !orderedPoiIds.includes(poiId))
      ) {
        return;
      }
      if (currentPoiIds.every((poiId, index) => poiId === orderedPoiIds[index])) {
        return;
      }
      pushUndoSnapshot();
      orderedPoiIds.forEach((poiId, index) => {
        itineraryPlan.assignments[poiId] = { dayId, order: index + 1 };
      });
      markDaysForReroute(dayId);
      recordItineraryChange(
        "reorder",
        `调整 ${dayById[dayId]?.short || dayId} 当天顺序`,
        currentPoiIds,
        [...orderedPoiIds],
        [dayId]
      );
      saveItineraryPlan(itineraryPlan);
      refreshItineraryView();
      renderDetailNavigation();
      renderMobileShell();
      saveAppState();
    };

    const shiftPoiInDay = (poiId, direction) => {
      const assignment = getPoiAssignment(poiId);
      if (!assignment || Number(assignment.order) <= 0) {
        return;
      }
      const orderedPoiIds = getDayPois(assignment.dayId)
        .filter(({ assignment: dayAssignment }) => Number(dayAssignment.order) > 0)
        .map(({ item }) => item.id);
      const currentIndex = orderedPoiIds.indexOf(poiId);
      const nextIndex = currentIndex + direction;
      if (currentIndex < 0 || nextIndex < 0 || nextIndex >= orderedPoiIds.length) {
        return;
      }
      [orderedPoiIds[currentIndex], orderedPoiIds[nextIndex]] = [orderedPoiIds[nextIndex], orderedPoiIds[currentIndex]];
      reorderDayPois(assignment.dayId, orderedPoiIds);
    };

    const assignPoiToDay = (poiId, dayId, refreshDetail = false) => {
      const item = markerByPoiId.get(poiId)?.item;
      if (!item || !dayById[dayId] || !isEventAssignable(item, dayById[dayId], PUBLIC_TRIP_DATA.trip.startDate)) {
        return;
      }
      const current = getPoiAssignment(poiId);
      if (current?.dayId === dayId) {
        return;
      }
      pushUndoSnapshot();
      itineraryPlan.assignments[poiId] = {
        dayId,
        order: current?.dayId === dayId ? current.order : getNextOrderForDay(dayId)
      };
      delete itineraryPlan.removed[poiId];
      normalizeDayPoiOrders(dayId);
      if (current?.dayId && current.dayId !== dayId) {
        normalizeDayPoiOrders(current.dayId);
      }
      markDaysForReroute(dayId, current?.dayId);
      recordItineraryChange(
        current?.dayId ? "move" : "add",
        `${current?.dayId ? "移动" : "加入"} ${getZhName(item)} 到 ${dayById[dayId].short}`,
        current ? clonePlainData(current) : null,
        clonePlainData(getPoiAssignment(poiId)),
        [dayId, current?.dayId]
      );
      saveItineraryPlan(itineraryPlan);
      refreshItineraryView();
      refreshPoiPresentation(poiId, refreshDetail);
      renderMobileShell();
      saveAppState();
    };

    const removePoiFromItinerary = (poiId, refreshDetail = false) => {
      if (!markerByPoiId.has(poiId)) {
        return;
      }
      const current = getPoiAssignment(poiId);
      if (!current) {
        return;
      }
      pushUndoSnapshot();
      delete itineraryPlan.assignments[poiId];
      itineraryPlan.removed[poiId] = true;
      if (current?.dayId) {
        normalizeDayPoiOrders(current.dayId);
        markDaysForReroute(current.dayId);
      }
      recordItineraryChange(
        "remove",
        `从 ${dayById[current.dayId]?.short || current.dayId} 移出 ${getZhName(markerByPoiId.get(poiId).item)}`,
        clonePlainData(current),
        null,
        [current.dayId]
      );
      saveItineraryPlan(itineraryPlan);
      refreshItineraryView();
      refreshPoiPresentation(poiId, refreshDetail);
      renderMobileShell();
      saveAppState();
    };

    const selectDayView = (dayId, { fit = false, openFirst = false } = {}) => {
      appState.dayView.selectedDayId = dayId || "";
      appState.activeDayId = dayId || "";
      ensureItineraryLayer();
      refreshItineraryView();
      const entry = dayId ? itineraryRouteEntries.get(dayId) : null;
      if (fit) {
        fitBoundsIfValid(entry?.focusBounds || getAllItineraryBounds(), entry?.focusFromEventIndex > 0 ? 14 : entry?.day?.travel ? 7 : 14);
      }
      if (openFirst && entry?.markers.length && !hasNumberedPoisForDay(dayId)) {
        (entry.markers[entry.focusFromEventIndex] || entry.markers[0]).openPopup();
      }
      saveAppState();
    };

    syncPoiListControls();
    refreshItineraryView();

    for (const control of [poiListSearch, poiListCity, poiListCategory, poiListPriority, poiListPlan]) {
      control.addEventListener("input", updatePoiListState);
      control.addEventListener("change", updatePoiListState);
    }

    showCandidatesToggle.addEventListener("change", () => {
      appState.dayView.showCandidates = showCandidatesToggle.checked;
      refreshItineraryView();
      saveAppState();
    });

    poiListClear.addEventListener("click", () => {
      appState.poiList = { ...defaultPoiListState };
      syncPoiListControls();
      renderPoiList();
      saveAppState();
    });

    const overlayControlEntries = {};
    for (const definition of overlayDefinitions) {
      layerKeyByLeafletId.set(L.stamp(definition.layer), definition.key);
      overlayControlEntries[typeof definition.label === "function" ? definition.label() : definition.label] = definition.layer;
      if (appState.layers[definition.key]) {
        definition.layer.addTo(map);
      }
    }

    const layerControl = L.control.layers(null, overlayControlEntries, { collapsed: shouldCollapseLayerControl(window.innerWidth) }).addTo(map);
    const layerControlList = layerControl.getContainer().querySelector(".leaflet-control-layers-list");
    const layerControlOverlays = layerControl.getContainer().querySelector(".leaflet-control-layers-overlays");
    const decorateLayerControl = () => {
      if (!layerControlList || !layerControlOverlays) {
        return;
      }

      layerControlList.querySelectorAll(".map-control-title").forEach((node) => node.remove());
      layerControlOverlays.querySelectorAll(".map-control-group-label").forEach((node) => node.remove());
      const routeLabels = [...layerControlOverlays.children].filter((node) => node.matches("label"));

      const title = document.createElement("div");
      title.className = "map-control-title";
      title.textContent = "地图显示";
      layerControlList.prepend(title);

      const routeHeading = document.createElement("div");
      routeHeading.className = "map-control-group-label";
      routeHeading.textContent = "路线与移动";
      layerControlOverlays.prepend(routeHeading);

      if (routeLabels[4]) {
        const poiHeading = document.createElement("div");
        poiHeading.className = "map-control-group-label";
        poiHeading.textContent = "地点分类";
        layerControlOverlays.insertBefore(poiHeading, routeLabels[4]);
      }
    };
    decorateLayerControl();
    map.on("layeradd layerremove", decorateLayerControl);

    const bounds = L.latLngBounds([
      ...stops.map((stop) => stop.coords),
      ...localStops.map((stop) => stop.coords)
    ]);
    const fitTripBounds = () => {
      map.invalidateSize({ pan: false });
      map.fitBounds(bounds.pad(0.08), { animate: false });
    };

    const restoreView = () => {
      map.invalidateSize({ pan: false });
      if (appState.view) {
        map.setView([appState.view.lat, appState.view.lng], appState.view.zoom, { animate: false });
        return;
      }
      fitTripBounds();
    };

    restoreView();
    requestAnimationFrame(() => requestAnimationFrame(restoreView));
    const invalidateMapAfterViewportTransition = () => {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        map.invalidateSize({ pan: false });
      }));
    };
    let layerControlUsesMobileMode = shouldCollapseLayerControl(window.innerWidth);
    window.addEventListener("resize", () => {
      const nextMobileMode = shouldCollapseLayerControl(window.innerWidth);
      if (nextMobileMode !== layerControlUsesMobileMode) {
        layerControlUsesMobileMode = nextMobileMode;
        appState.mobile.layerControlOpen = false;
        if (nextMobileMode) {
          layerControl.collapse();
        } else {
          layerControl.expand();
        }
        renderMobileShell();
      }
      invalidateMapAfterViewportTransition();
    });

    map.on("moveend zoomend", () => {
      const center = map.getCenter();
      appState.view = {
        lat: center.lat,
        lng: center.lng,
        zoom: map.getZoom()
      };
      saveAppState();
    });

    map.on("overlayadd overlayremove", (event) => {
      const key = layerKeyByLeafletId.get(L.stamp(event.layer));
      if (!key) {
        return;
      }
      appState.layers[key] = event.type === "overlayadd";
      saveAppState();
    });

    const appRoot = document.querySelector(".app");
    const sidebar = document.getElementById("sidebar");
    const itineraryPanel = document.getElementById("itinerary-panel");
    const poiDetailPanel = document.getElementById("poi-detail-panel");
    const poiDetailOverview = document.getElementById("poi-detail-overview");
    const poiDetailDayRail = document.getElementById("poi-detail-day-rail");
    const poiDetailDayHeading = document.getElementById("poi-detail-day-heading");
    const poiDetailDaySummary = document.getElementById("poi-detail-day-summary");
    const poiDetailDayList = document.getElementById("poi-detail-day-list");
    const poiDetailMain = poiDetailPanel.querySelector(".poi-detail-main");
    const poiDetailKicker = document.getElementById("poi-detail-kicker");
    const poiDetailTitle = document.getElementById("poi-detail-title");
    const poiDetailOriginal = document.getElementById("poi-detail-original");
    const poiDetailItineraryControls = document.getElementById("poi-detail-itinerary-controls");
    const poiDetailContent = document.getElementById("poi-detail-content");
    const mobileBottomSheet = document.getElementById("mobile-bottom-sheet");
    const mobileSheetHandle = document.getElementById("mobile-sheet-handle");
    const mobileAppTitle = document.getElementById("mobile-app-title");
    const mobileAppMeta = document.getElementById("mobile-app-meta");
    const mobileOverviewAction = document.getElementById("mobile-overview-action");
    const mobileSearchAction = document.getElementById("mobile-search-action");
    const mobileLayerAction = document.getElementById("mobile-layer-action");
    const mobileCandidatesAction = document.getElementById("mobile-candidates-action");
    const mobileUndoAction = document.getElementById("mobile-undo-action");
    const mobileChangeSummaryAction = document.getElementById("mobile-change-summary-action");
    const mobileReplanAction = document.getElementById("mobile-replan-action");
    const mobileChangeSummary = document.getElementById("mobile-change-summary");
    const mobileChangeSummaryMeta = document.getElementById("mobile-change-summary-meta");
    const mobileChangeSummaryList = document.getElementById("mobile-change-summary-list");
    const mobileReplanFallback = document.getElementById("mobile-replan-fallback");

    const invalidateReplanFallback = () => {
      mobileReplanFallback.value = "";
      mobileReplanFallback.hidden = true;
      mobileReplanAction.textContent = "请 Codex 重新安排";
    };

    const setMobileSheetSnap = (snap, { persist = true } = {}) => {
      const normalized = normalizeMobileSheetSnap(snap);
      appState.mobile.sheetSnap = normalized;
      mobileBottomSheet.setAttribute("data-sheet-snap", normalized);
      const expanded = normalized === "expanded";
      mobileSheetHandle.setAttribute("aria-expanded", String(expanded));
      mobileSheetHandle.setAttribute("aria-label", expanded ? "收起行程面板" : "展开行程面板");
      requestAnimationFrame(() => map.invalidateSize({ pan: false }));
      if (persist) {
        saveAppState();
      }
    };

    const renderChangeSummary = (open = !mobileChangeSummary.hidden) => {
      const changes = itineraryPlan.changes || [];
      const affectedDayIds = [...new Set(changes.flatMap((change) => change.affectedDays || change.affectedDayIds || []))];
      mobileChangeSummaryMeta.textContent = changes.length
        ? `${changes.length} 项修改 · 影响 ${affectedDayIds.length} 天 · 正式路线仍需重新复核。`
        : "还没有修改行程。";
      mobileChangeSummaryList.innerHTML = changes.length
        ? changes.map((change) => `<li>${escapeHtml(describeItineraryChange(change))}</li>`).join("")
        : "";
      mobileChangeSummary.hidden = !open;
      mobileChangeSummaryAction.setAttribute("aria-expanded", String(open));
    };

    const renderMobileShell = () => {
      const mode = normalizeMobileViewMode(appState.mobile.viewMode);
      const selectedDay = getVisibleDay();
      const selectedEntry = activePoiDetailId ? markerByPoiId.get(activePoiDetailId) : null;
      mobileBottomSheet.setAttribute("data-mobile-view", mode);
      mobileBottomSheet.setAttribute("data-sheet-snap", normalizeMobileSheetSnap(appState.mobile.sheetSnap));

      if (mode === "day" && selectedDay) {
        mobileAppTitle.textContent = `${selectedDay.short} · ${cityLabels[selectedDay.city] || selectedDay.city}`;
        mobileAppMeta.textContent = [
          formatScheduledPlacesSummary(getDayPois(selectedDay.id)),
          formatCityEventNoticeSummary(getCityEventsForDay(
            tripEvents,
            selectedDay,
            PUBLIC_TRIP_DATA.trip.startDate
          ).length)
        ].filter(Boolean).join("；");
      } else if (mode === "detail" && selectedEntry) {
        mobileAppTitle.textContent = getZhName(selectedEntry.item);
        mobileAppMeta.textContent = `${cityLabels[selectedEntry.item.city] || selectedEntry.item.city} · ${poiCategories[selectedEntry.item.category].label}`;
      } else if (mode === "candidates") {
        mobileAppTitle.textContent = selectedDay ? `${selectedDay.short} · 顺路备选` : "地点搜索";
        mobileAppMeta.textContent = selectedDay
          ? `${getDayCandidatePois(selectedDay.id, getDayPois(selectedDay.id)).items.length} 个顺路候选`
          : `${pois.length} 个公开地点`;
      } else {
        mobileAppTitle.textContent = PUBLIC_TRIP_DATA.trip.title;
        mobileAppMeta.textContent = `${itineraryDays.length} 天 · ${PUBLIC_TRIP_DATA.trip.cities.length} 个城市`;
      }

      mobileOverviewAction.querySelector(".mobile-app-action-label").textContent = mode === "detail" ? "返回" : "总览";
      mobileOverviewAction.setAttribute("aria-label", mode === "detail" ? "返回上一层" : "返回全程总览");
      mobileLayerAction.setAttribute("aria-expanded", String(Boolean(appState.mobile.layerControlOpen)));
      mobileUndoAction.disabled = !itineraryPlan.undoStack.length;
      mobileChangeSummaryAction.textContent = itineraryPlan.changes.length
        ? `修改(${itineraryPlan.changes.length})`
        : "修改汇总";
      mobileReplanAction.disabled = !itineraryPlan.changes.length;
      renderChangeSummary(!mobileChangeSummary.hidden);
    };

    const setMobileViewMode = (mode, { sheetSnap } = {}) => {
      const normalized = normalizeMobileViewMode(mode);
      const currentMode = normalizeMobileViewMode(appState.mobile.viewMode);
      if (normalized === "detail" && currentMode !== "detail") {
        appState.mobile.previousViewMode = currentMode === "overview" && appState.dayView.selectedDayId
          ? "day"
          : currentMode;
      }
      appState.mobile.viewMode = normalized;
      if (normalized === "overview" || normalized === "candidates") {
        itineraryPanel.hidden = false;
        poiDetailPanel.hidden = true;
        sidebar.classList.remove("detail-mode");
        appRoot.classList.remove("detail-browse");
      } else {
        itineraryPanel.hidden = true;
        poiDetailPanel.hidden = false;
        sidebar.classList.add("detail-mode");
        appRoot.classList.add("detail-browse");
      }
      if (sheetSnap) {
        setMobileSheetSnap(sheetSnap, { persist: false });
      }
      renderMobileShell();
      requestAnimationFrame(() => map.invalidateSize({ pan: false }));
      saveAppState();
    };

    const openMobileCandidates = ({ searchAll = false } = {}) => {
      const selectedDay = getVisibleDay();
      appState.dayView.showCandidates = true;
      appState.poiList.plan = selectedDay && !searchAll ? "candidates" : "all";
      appState.poiList.city = selectedDay && !searchAll ? selectedDay.city : "";
      syncPoiListControls();
      refreshItineraryView();
      setMobileViewMode("candidates", { sheetSnap: "compact" });
    };

    const toggleMobileLayerControl = () => {
      if (!shouldCollapseLayerControl(window.innerWidth)) {
        return;
      }
      const open = getNextMobileLayerControlState(appState.mobile.layerControlOpen);
      appState.mobile.layerControlOpen = open;
      if (open) {
        layerControl.expand();
      } else {
        layerControl.collapse();
      }
      renderMobileShell();
      saveAppState();
    };

    const undoLastItineraryChange = () => {
      const snapshot = itineraryPlan.undoStack.pop();
      if (!snapshot) {
        return;
      }
      itineraryPlan.assignments = clonePlainData(snapshot.assignments);
      itineraryPlan.removed = clonePlainData(snapshot.removed);
      itineraryPlan.dirtyDays = clonePlainData(snapshot.dirtyDays);
      itineraryPlan.changes = clonePlainData(snapshot.changes);
      for (const key of Object.keys(priorities)) {
        delete priorities[key];
      }
      Object.assign(priorities, clonePlainData(snapshot.priorities));
      savePriorities(priorities);
      saveItineraryPlan(itineraryPlan);
      invalidateReplanFallback();
      refreshItineraryView();
      renderDetailNavigation();
      if (activePoiDetailId) {
        const entry = markerByPoiId.get(activePoiDetailId);
        if (entry) {
          renderPoiDetail(entry.item, { preserveScroll: true });
        }
      }
      if (!itineraryPlan.changes.length) {
        renderChangeSummary(false);
      }
      renderMobileShell();
      saveAppState();
    };

    const copyReplanRequest = async () => {
      const changes = itineraryPlan.changes || [];
      if (!changes.length) {
        renderChangeSummary(true);
        return;
      }
      const affectedDays = [...new Set(changes.flatMap((change) => change.affectedDays || change.affectedDayIds || []))]
        .map((dayId) => dayById[dayId]?.short || dayId)
        .join("、");
      const requestText = [
        `请根据我在《${PUBLIC_TRIP_DATA.trip.title}》地图里的选择重新安排行程。`,
        ...changes.map((change, index) => `${index + 1}. ${describeItineraryChange(change)}`),
        `受影响日期：${affectedDays || "待复核"}。`,
        "请重新检查营业时间、预约、交通、同日容量、吃饭和休息，不要把地图中的调整直接当成已验证路线。"
      ].join("\n");
      try {
        await navigator.clipboard.writeText(requestText);
        mobileReplanFallback.value = "";
        mobileReplanFallback.hidden = true;
        mobileReplanAction.textContent = "已复制请求";
      } catch {
        mobileReplanFallback.value = requestText;
        mobileReplanFallback.hidden = false;
        renderChangeSummary(true);
        mobileReplanFallback.focus();
        mobileReplanFallback.select();
        let copied = false;
        try {
          copied = document.execCommand("copy");
        } catch {
          copied = false;
        }
        mobileReplanAction.textContent = copied ? "已复制请求" : "复制失败，请打开汇总";
        if (copied) {
          mobileReplanFallback.value = "";
          mobileReplanFallback.hidden = true;
        }
      }
      window.setTimeout(() => {
        mobileReplanAction.textContent = "请 Codex 重新安排";
      }, 1800);
    };
    setMobileSheetSnap(appState.mobile.sheetSnap, { persist: false });
    renderMobileShell();
    let itineraryScrollTop = typeof appState.sidebarScroll === "number" ? appState.sidebarScroll : 0;
    sidebar.scrollTop = itineraryScrollTop;
    sidebar.addEventListener("scroll", () => {
      if (activePoiDetailId) {
        return;
      }
      itineraryScrollTop = sidebar.scrollTop;
      appState.sidebarScroll = sidebar.scrollTop;
      saveAppState();
    }, { passive: true });

    for (const button of document.querySelectorAll("[data-zoom-city]")) {
      button.addEventListener("click", () => {
        const city = button.getAttribute("data-zoom-city");
        if (city === "All") {
          showAllItineraryRoutes({ fit: true });
          return;
        }

        if (cityLabels[city]) {
          showCityItinerarySegment(city);
          return;
        }

        const targetBounds = poiBoundsByCity.get(city);
        if (targetBounds) {
          map.fitBounds(targetBounds.pad(0.18), { animate: false, maxZoom: 13 });
        }
      });
    }

    const getResourceUrls = (item) => ({
      official: getOfficialUrl(item),
      images: getImageUrl(item),
      map: getMapUrl(item),
      xhs: getXiaohongshuUrl(item)
    });

    const setPoiDetailImage = (image) => {
      const viewer = document.getElementById("poi-detail-image-viewer");
      if (!viewer) {
        return;
      }
      viewer.style.display = "block";
      viewer.innerHTML = `
        <img src="${image.large}" alt="${escapeHtml(image.title)}" loading="lazy" decoding="async">
        <div class="image-preview-caption">${escapeHtml(image.title)}</div>
      `;
    };

    const setPoiDetailImageEmptyState = (item) => {
      const viewer = document.getElementById("poi-detail-image-viewer");
      if (!viewer) {
        return;
      }
      const searchTerms = getCommonsSearchTerms(item);
      const mapUrl = getMapUrl(item);
      viewer.style.display = "block";
      viewer.innerHTML = `
        <div class="image-preview-caption">
          Wikimedia Commons 没有返回可预览图片。当前同页搜索词：${escapeHtml(searchTerms)}。<br>
          对咖啡店、酒吧、甜品店这类商业地点很常见，可以前往 Google 地图查看该地点的近期照片。
        </div>
        <div class="poi-detail-actions image-empty-actions">
          <a class="image-empty-google-link" href="${mapUrl}" target="_blank" rel="noopener noreferrer">查看 Google 地图照片</a>
        </div>
      `;
    };

    const loadPoiDetailImages = (item) => {
      const detailId = item.id;
      const status = document.getElementById("poi-detail-image-status");
      const preview = document.getElementById("poi-detail-image-preview");
      if (!status || !preview) {
        return;
      }
      status.textContent = "正在加载同页图片预览...";
      loadCommonsImages(item)
        .then((images) => {
          if (activePoiDetailId !== detailId) {
            return;
          }
          if (!images.length) {
            setPoiDetailImageEmptyState(item);
            status.textContent = "搜索完成，但 Wikimedia Commons 没有这个地点的可预览图片，不是页面故障。";
            return;
          }
          status.textContent = `已载入 ${images.length} 张预览图，点击缩略图可切换大图。`;
          setPoiDetailImage(images[0]);
          preview.innerHTML = images.map((image, index) => `
            <button type="button" data-preview-image="${index}" data-poi-id="${item.id}" title="${escapeHtml(image.title)}">
              <img src="${image.thumb}" alt="${escapeHtml(image.title)}" loading="lazy" decoding="async">
            </button>
          `).join("");
        })
        .catch(() => {
          if (activePoiDetailId === detailId) {
            setPoiDetailImageEmptyState(item);
            status.textContent = "同页图片预览暂时加载失败，可使用外部照片入口。";
          }
        });
    };

    const renderDetailDayRail = () => {
      const selectedDayId = appState.dayView.selectedDayId || "";
      poiDetailDayRail.innerHTML = itineraryDays.map((day) => `
        <button
          type="button"
          class="poi-detail-day-button ${selectedDayId === day.id ? "active" : ""}"
          data-detail-day="${day.id}"
          style="--day-color:${day.color};"
          aria-current="${selectedDayId === day.id ? "date" : "false"}"
          title="${escapeHtml(day.date)} · ${escapeHtml(cityLabels[day.city] || day.city)} · ${escapeHtml(day.title)}"
        >
          <span>${escapeHtml(day.short)}</span>
          <small>${escapeHtml(day.city === "Transit" ? "交通" : cityLabels[day.city] || day.city)}</small>
        </button>
      `).join("");
    };

    let lastCenteredDetailDayId = "";
    const centerActiveDetailDay = () => {
      const selectedDayId = appState.dayView.selectedDayId || "";
      if (!shouldCollapseLayerControl(window.innerWidth) || !selectedDayId || selectedDayId === lastCenteredDetailDayId) {
        return;
      }
      lastCenteredDetailDayId = selectedDayId;
      requestAnimationFrame(() => {
        if (appState.dayView.selectedDayId !== selectedDayId) {
          return;
        }
        const activeButton = poiDetailDayRail.querySelector(".poi-detail-day-button.active");
        if (!activeButton) {
          return;
        }
        const railRect = poiDetailDayRail.getBoundingClientRect();
        const activeRect = activeButton.getBoundingClientRect();
        const itemOffsetLeft = activeRect.left - railRect.left + poiDetailDayRail.scrollLeft;
        const left = calculateCenteredRailScrollLeft(
          poiDetailDayRail.clientWidth,
          poiDetailDayRail.scrollWidth,
          itemOffsetLeft,
          activeRect.width
        );
        poiDetailDayRail.scrollTo({ left, behavior: "smooth" });
      });
    };

    const findMatchingDayEventIndex = (day, item) => {
      let nearestIndex = -1;
      let nearestDistance = Infinity;
      day.events.forEach((event, index) => {
        const distance = getPlanningDistanceKm(event.coords, item.coords);
        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearestIndex = index;
        }
      });
      return nearestDistance <= 0.12 ? nearestIndex : -1;
    };

    const formatPlanningDistance = (distanceKm) => distanceKm < 1
      ? `约 ${Math.max(50, Math.round(distanceKm * 1000 / 50) * 50)} 米`
      : `约 ${distanceKm.toFixed(1)} 公里`;

    const getDayPoiTransitHint = (dayId, dayPois, index) => {
      if (index <= 0 || !dayPois[index - 1] || !dayPois[index]) {
        return null;
      }
      if (itineraryPlan.dirtyDays[dayId]) {
        return {
          estimated: true,
          text: "顺序或安排已调整，交通待复核"
        };
      }
      const day = dayById[dayId];
      const fromItem = dayPois[index - 1].item;
      const toItem = dayPois[index].item;
      if (!day) {
        return null;
      }

      const fromEventIndex = findMatchingDayEventIndex(day, fromItem);
      const toEventIndex = findMatchingDayEventIndex(day, toItem);
      const reviewedTransit = fromEventIndex >= 0 && toEventIndex === fromEventIndex + 1
        ? day.events[fromEventIndex].transitToNext
        : null;
      if (reviewedTransit && (reviewedTransit.distance || reviewedTransit.duration)) {
        const mode = transitModeMeta[reviewedTransit.mode] || transitModeMeta.transit;
        return {
          estimated: false,
          text: [mode.label, reviewedTransit.distance, reviewedTransit.duration].filter(Boolean).join(" · ")
        };
      }

      const estimatedDistanceKm = Math.max(0.05, getPlanningDistanceKm(fromItem.coords, toItem.coords) * 1.25);
      const distanceLabel = formatPlanningDistance(estimatedDistanceKm);
      if (estimatedDistanceKm > 2.2) {
        return {
          estimated: true,
          text: `${distanceLabel} · 建议公交或打车 · 规划估算`
        };
      }
      const rawWalkMinutes = estimatedDistanceKm / 4.5 * 60;
      const walkMinutes = rawWalkMinutes < 10
        ? Math.max(2, Math.round(rawWalkMinutes))
        : Math.max(10, Math.round(rawWalkMinutes / 5) * 5);
      return {
        estimated: true,
        text: `步行 ${distanceLabel} · 约 ${walkMinutes} 分钟 · 规划估算`
      };
    };

    const renderPoiDetailDayList = (dayId) => {
      const day = dayById[dayId];
      if (!day) {
        poiDetailDayHeading.textContent = "当天安排";
        poiDetailDaySummary.textContent = "请选择日期";
        poiDetailDaySummary.classList.remove("needs-reroute");
        poiDetailDayList.innerHTML = '<div class="poi-detail-day-list-empty">从左侧选择日期，查看当天已经安排的地点。</div>';
        return;
      }

      const dayPois = getDayPois(dayId);
      const candidateResult = getDayCandidatePois(dayId, dayPois);
      const movableDayPois = dayPois.filter(({ assignment }) => Number(assignment.order) > 0);
      const needsReroute = Boolean(itineraryPlan.dirtyDays[dayId]);
      const cityEventNoticesHtml = renderCityEventNotices(day);
      const cityEventNoticeSummary = formatCityEventNoticeSummary(getCityEventsForDay(
        tripEvents,
        day,
        PUBLIC_TRIP_DATA.trip.startDate
      ).length);
      poiDetailDayHeading.innerHTML = `<span class="desktop-only-label">${escapeHtml(day.short)}</span><span class="mobile-only-label">当天安排</span>`;
      poiDetailDaySummary.textContent = `${cityLabels[day.city] || day.city} · ${formatScheduledPlacesSummary(dayPois)}${cityEventNoticeSummary ? ` · ${cityEventNoticeSummary}` : ""}${needsReroute ? " · 路线需要重新安排" : ""}`;
      poiDetailDaySummary.classList.toggle("needs-reroute", needsReroute);
      if (day.city === "Transit") {
        poiDetailDayList.innerHTML = composeDayListEventSections(
          cityEventNoticesHtml,
          "",
          `<div class="poi-detail-day-list-empty">交通日没有单独的地点详情，路线节点仍显示在地图上。</div>`,
          ""
        );
        return;
      }

      const scheduledHtml = dayPois.length ? dayPois.map(({ item, assignment }, index) => {
        const meta = poiCategories[item.category];
        const zhName = getZhName(item);
        const movable = Number(assignment.order) > 0;
        const movableIndex = movableDayPois.findIndex(({ item: dayItem }) => dayItem.id === item.id);
        const orderLabel = movable ? assignment.order : meta.short;
        const active = activePoiDetailId === item.id;
        const transitHint = getDayPoiTransitHint(dayId, dayPois, index);
        return `
          ${transitHint ? `<div class="poi-detail-day-transit ${transitHint.estimated ? "estimated" : ""}" title="从上一站：${escapeHtml(transitHint.text)}">${escapeHtml(transitHint.text)}</div>` : ""}
          <div
            class="poi-detail-day-place ${active ? "active" : ""}"
            ${movable ? `data-sortable-poi="${item.id}"` : ""}
            style="--place-color:${meta.color};"
          >
            ${movable
              ? `<button type="button" class="poi-detail-day-place-handle" data-drag-poi="${item.id}" aria-label="拖动调整 ${escapeHtml(zhName)} 的顺序" title="拖动调整顺序">⠿</button>`
              : '<span class="poi-detail-day-place-spacer" aria-hidden="true"></span>'}
            <button type="button" class="poi-detail-day-place-open" data-detail-poi="${item.id}" data-mobile-view="detail" aria-pressed="${active}">
              <span class="poi-detail-day-place-order">${escapeHtml(orderLabel)}</span>
              <span class="poi-detail-day-place-copy">
                <strong>${escapeHtml(zhName)}</strong>
                <span>${escapeHtml(meta.label)} · ${escapeHtml(item.area)}</span>
              </span>
            </button>
            ${movable ? `<span class="poi-detail-day-place-actions">
              <button type="button" class="poi-detail-day-toggle remove" data-remove-itinerary="${item.id}" aria-label="从 ${escapeHtml(day.short)} 移出 ${escapeHtml(zhName)}" title="移出这一天">−</button>
              <span class="poi-detail-day-place-shifts" aria-label="移动顺序">
                <button type="button" class="poi-detail-day-shift" data-shift-poi="${item.id}" data-shift-direction="-1" aria-label="上移 ${escapeHtml(zhName)}" title="上移" ${movableIndex === 0 ? "disabled" : ""}>↑</button>
                <button type="button" class="poi-detail-day-shift" data-shift-poi="${item.id}" data-shift-direction="1" aria-label="下移 ${escapeHtml(zhName)}" title="下移" ${movableIndex === movableDayPois.length - 1 ? "disabled" : ""}>↓</button>
              </span>
            </span>` : '<span class="poi-detail-day-action-spacer" aria-hidden="true"></span>'}
          </div>
        `;
      }).join("") : '<div class="poi-detail-day-list-empty">这一天还没有安排地点，可从下方顺路备选加入。</div>';

      const candidateHtml = candidateResult.items.length ? `
        <div class="poi-detail-day-section-label">
          <strong>顺路备选</strong>
          <span>最近 ${candidateResult.items.length} / ${candidateResult.total}</span>
        </div>
        ${candidateResult.items.map((item) => {
          const meta = poiCategories[item.category];
          const zhName = getZhName(item);
          const active = activePoiDetailId === item.id;
          const assignable = isEventAssignable(item, day, PUBLIC_TRIP_DATA.trip.startDate);
          return `
            <div class="poi-detail-day-place candidate ${active ? "active" : ""}" style="--place-color:${meta.color};">
              <span class="poi-detail-day-place-spacer" aria-hidden="true"></span>
              <button type="button" class="poi-detail-day-place-open" data-detail-poi="${item.id}" data-mobile-view="detail" aria-pressed="${active}">
                <span class="poi-detail-day-place-order">${escapeHtml(meta.short)}</span>
                <span class="poi-detail-day-place-copy">
                  <strong>${escapeHtml(zhName)}</strong>
                  <span>${escapeHtml(meta.label)} · ${escapeHtml(item.area)}</span>
                  ${assignable ? "" : `<span>${escapeHtml(getEventWaitingCopy(item))}</span>`}
                </span>
              </button>
              <span class="poi-detail-day-place-actions">
                ${assignable
                  ? `<button type="button" class="poi-detail-day-toggle add" data-assign-day="${dayId}" data-poi-id="${item.id}" aria-label="加入 ${escapeHtml(zhName)} 到 ${escapeHtml(day.short)}" title="加入这一天">+</button>`
                  : `<button type="button" class="poi-detail-day-toggle add" disabled aria-label="${escapeHtml(getEventWaitingCopy(item))}" title="${escapeHtml(getEventWaitingCopy(item))}">?</button>`}
              </span>
            </div>
          `;
        }).join("")}
      ` : "";

      const routeWarningHtml = needsReroute
        ? '<div class="poi-detail-day-route-warning">顺序或安排已调整，交通待复核。原路线仅作参考，可用“撤销上一步”恢复最近修改。</div>'
        : "";
      poiDetailDayList.innerHTML = composeDayListEventSections(
        cityEventNoticesHtml,
        routeWarningHtml,
        scheduledHtml,
        candidateHtml
      );
    };

    const renderDetailNavigation = () => {
      renderDetailDayRail();
      centerActiveDetailDay();
      renderPoiDetailDayList(appState.dayView.selectedDayId || "");
    };

    const renderPoiDetailEmpty = () => {
      poiDetailKicker.textContent = "地点详情";
      poiDetailTitle.textContent = "选择一个地点";
      poiDetailOriginal.textContent = "";
      poiDetailOriginal.hidden = true;
      poiDetailItineraryControls.innerHTML = "";
      poiDetailContent.innerHTML = '<div class="poi-detail-empty">选择当天安排或地图上的地点查看详情</div>';
      poiDetailMain.scrollTop = 0;
    };

    const enterDetailBrowse = () => {
      sidebar.classList.add("detail-mode");
      appRoot.classList.add("detail-browse");
      itineraryPanel.hidden = true;
      poiDetailPanel.hidden = false;
      requestAnimationFrame(() => map.invalidateSize({ pan: false }));
    };

    const renderPoiDetail = (item, { preserveScroll = false } = {}) => {
      const detailScrollTop = preserveScroll ? poiDetailMain.scrollTop : 0;
      const zhName = getZhName(item);
      poiDetailKicker.textContent = `${cityLabels[item.city] || item.city} · ${item.area} · ${poiCategories[item.category].label}`;
      poiDetailTitle.textContent = zhName;
      poiDetailOriginal.textContent = zhName === item.name ? "" : item.name;
      poiDetailOriginal.hidden = zhName === item.name;
      poiDetailItineraryControls.innerHTML = poiDetailItineraryControlsHtml(item);
      poiDetailContent.innerHTML = poiDetailHtml(item);
      loadPoiDetailImages(item);
      requestAnimationFrame(() => {
        poiDetailMain.scrollTop = detailScrollTop;
      });
    };

    const selectDetailDay = (dayId) => {
      selectDayView(dayId, { fit: false, openFirst: false });
      enterDetailBrowse();
      renderDetailNavigation();
      setMobileViewMode("day");
    };

    const ensurePoiMarkerVisible = (entry) => {
      const layer = poiLayers[entry.item.category];
      const layerKey = categoryLayerKeys[entry.item.category];
      if (!map.hasLayer(layer)) {
        layer.addTo(map);
        appState.layers[layerKey] = true;
      }
      if (!layer.hasLayer(entry.marker)) {
        layer.addLayer(entry.marker);
      }
    };

    const refreshSelectedPoiMarker = (previousPoiId, nextPoiId) => {
      const affectedPoiIds = new Set([previousPoiId, nextPoiId].filter(Boolean));
      for (const poiId of affectedPoiIds) {
        const entry = markerByPoiId.get(poiId);
        if (!entry) {
          continue;
        }
        entry.marker.setIcon(poiIcon(entry.item));
        entry.marker.setZIndexOffset(poiId === nextPoiId ? 3000 : 1000);
      }
    };

    const openPoiDetail = (poiId, { syncDay = true, focusMap = true } = {}) => {
      const entry = markerByPoiId.get(poiId);
      if (!entry) {
        return;
      }
      if (poiDetailPanel.hidden) {
        itineraryScrollTop = sidebar.scrollTop;
        appState.sidebarScroll = itineraryScrollTop;
      }
      const assignment = getPoiAssignment(poiId);
      if (syncDay && assignment?.dayId) {
        selectDayView(assignment.dayId, { fit: false, openFirst: false });
      }
      const previousPoiId = activePoiDetailId;
      activePoiDetailId = poiId;
      ensurePoiMarkerVisible(entry);
      refreshSelectedPoiMarker(previousPoiId, poiId);
      map.closePopup();
      enterDetailBrowse();
      setMobileViewMode("detail", { sheetSnap: "compact" });
      renderDetailNavigation();
      renderPoiDetail(entry.item);
      if (focusMap) {
        focusPoiOnMap(entry);
      }
      appState.openPoiId = poiId;
      saveAppState();
    };

    const returnToTripOverview = () => {
      const previousPoiId = activePoiDetailId;
      activePoiDetailId = "";
      refreshSelectedPoiMarker(previousPoiId, "");
      delete appState.openPoiId;
      poiDetailPanel.hidden = true;
      itineraryPanel.hidden = false;
      sidebar.classList.remove("detail-mode");
      appRoot.classList.remove("detail-browse");
      appState.mobile.viewMode = "overview";
      appState.mobile.previousViewMode = "day";
      appState.mobile.sheetSnap = "compact";
      renderPoiDetailEmpty();
      showAllItineraryRoutes({ fit: true });
      renderMobileShell();
      requestAnimationFrame(() => {
        sidebar.scrollTop = itineraryScrollTop;
        map.invalidateSize({ pan: false });
      });
      saveAppState();
    };

    poiDetailOverview.addEventListener("click", returnToTripOverview);

    const returnFromMobileDetail = () => {
      delete appState.openPoiId;
      const previousMode = normalizeMobileViewMode(appState.mobile.previousViewMode);
      if (previousMode === "candidates") {
        syncPoiListControls();
        renderPoiList();
        setMobileViewMode("candidates", { sheetSnap: "compact" });
        return;
      }
      if (previousMode === "day" && appState.dayView.selectedDayId) {
        setMobileViewMode("day", { sheetSnap: "compact" });
        renderDetailNavigation();
        return;
      }
      returnToTripOverview();
    };

    mobileSheetHandle.addEventListener("click", () => {
      setMobileSheetSnap(appState.mobile.sheetSnap === "expanded" ? "compact" : "expanded");
    });
    mobileOverviewAction.addEventListener("click", () => {
      if (appState.mobile.viewMode === "detail") {
        returnFromMobileDetail();
        return;
      }
      returnToTripOverview();
    });
    mobileSearchAction.addEventListener("click", () => {
      openMobileCandidates({ searchAll: !getVisibleDay() });
      setMobileSheetSnap("expanded");
      requestAnimationFrame(() => poiListSearch.focus());
    });
    mobileLayerAction.addEventListener("click", toggleMobileLayerControl);
    mobileCandidatesAction.addEventListener("click", () => openMobileCandidates());
    mobileUndoAction.addEventListener("click", undoLastItineraryChange);
    mobileChangeSummaryAction.addEventListener("click", () => {
      renderChangeSummary(mobileChangeSummary.hidden);
    });
    mobileReplanAction.addEventListener("click", copyReplanRequest);

    requestAnimationFrame(() => {
      const openEntry = appState.openPoiId ? markerByPoiId.get(appState.openPoiId) : null;
      if (openEntry) {
        openPoiDetail(openEntry.item.id, { syncDay: false });
        return;
      }
      if (appState.dayView.selectedDayId) {
        enterDetailBrowse();
        renderDetailNavigation();
        renderPoiDetailEmpty();
        setMobileViewMode("day", { sheetSnap: appState.mobile.sheetSnap });
      }
    });

    const DETAIL_SORT_HOLD_MS = 160;
    const DETAIL_SORT_EDGE_PX = 48;
    const DETAIL_SORT_MAX_SCROLL_PX = 14;
    const detailSortIndicator = document.createElement("div");
    detailSortIndicator.className = "poi-detail-day-drop-indicator";
    detailSortIndicator.setAttribute("aria-label", "松手后的插入位置");
    let detailPointerSort = null;
    let detailSortAutoScrollFrame = null;

    const detailSortableRows = () => Array.from(
      poiDetailDayList.querySelectorAll("[data-sortable-poi]")
    );

    const placeDetailSortIndicator = (clientY) => {
      if (!detailPointerSort?.active) {
        return;
      }
      const nextRow = detailSortableRows()
        .filter((row) => row !== detailPointerSort.row)
        .find((row) => {
          const rect = row.getBoundingClientRect();
          return clientY < rect.top + rect.height / 2;
        });
      if (nextRow) {
        poiDetailDayList.insertBefore(detailSortIndicator, nextRow);
        return;
      }
      const candidateBoundary = poiDetailDayList.querySelector(".poi-detail-day-section-label");
      poiDetailDayList.insertBefore(detailSortIndicator, candidateBoundary || null);
    };

    const updateDetailDraggedTransform = () => {
      if (!detailPointerSort?.active) {
        return;
      }
      const pointerDelta = detailPointerSort.lastY - detailPointerSort.startY;
      const scrollDelta = poiDetailDayList.scrollTop - detailPointerSort.startScrollTop;
      detailPointerSort.row.style.transform = `scale(1.015) translateY(${pointerDelta + scrollDelta}px)`;
    };

    const stopDetailSortAutoScroll = () => {
      if (detailSortAutoScrollFrame) {
        cancelAnimationFrame(detailSortAutoScrollFrame);
      }
      detailSortAutoScrollFrame = null;
      poiDetailDayList.classList.remove("edge-scroll-top", "edge-scroll-bottom");
    };

    const runDetailSortAutoScroll = () => {
      if (!detailPointerSort?.active) {
        return;
      }
      const rect = poiDetailDayList.getBoundingClientRect();
      const velocity = calculateEdgeAutoScrollVelocity(
        detailPointerSort.lastY,
        rect.top,
        rect.bottom,
        DETAIL_SORT_EDGE_PX,
        DETAIL_SORT_MAX_SCROLL_PX
      );
      const previousScrollTop = poiDetailDayList.scrollTop;
      poiDetailDayList.scrollTop += velocity;
      poiDetailDayList.classList.toggle("edge-scroll-top", velocity < 0);
      poiDetailDayList.classList.toggle("edge-scroll-bottom", velocity > 0);
      if (poiDetailDayList.scrollTop !== previousScrollTop) {
        detailPointerSort.moved = true;
        updateDetailDraggedTransform();
        placeDetailSortIndicator(detailPointerSort.lastY);
      }
      detailSortAutoScrollFrame = requestAnimationFrame(runDetailSortAutoScroll);
    };

    const beginDetailPointerSort = () => {
      if (!detailPointerSort?.row) {
        return;
      }
      detailPointerSort.active = true;
      detailPointerSort.startScrollTop = poiDetailDayList.scrollTop;
      detailPointerSort.row.classList.add("dragging");
      detailSortIndicator.hidden = false;
      placeDetailSortIndicator(detailPointerSort.lastY);
      detailSortAutoScrollFrame = requestAnimationFrame(runDetailSortAutoScroll);
    };

    const clearDetailSortHold = () => {
      if (detailPointerSort?.holdTimer) {
        clearTimeout(detailPointerSort.holdTimer);
        detailPointerSort.holdTimer = null;
      }
    };

    const finishDetailPointerSort = (commit, pointerId = null) => {
      if (!detailPointerSort || (pointerId !== null && pointerId !== detailPointerSort.pointerId)) {
        return;
      }
      clearDetailSortHold();
      stopDetailSortAutoScroll();
      try {
        if (detailPointerSort.handle.hasPointerCapture?.(detailPointerSort.pointerId)) {
          detailPointerSort.handle.releasePointerCapture(detailPointerSort.pointerId);
        }
      } catch (_error) {
        // Pointer capture can already be gone after a browser-level cancellation.
      }

      const { active, moved, row, originalOrder, poiId } = detailPointerSort;
      if (active && commit && moved && detailSortIndicator.parentNode === poiDetailDayList) {
        poiDetailDayList.insertBefore(row, detailSortIndicator);
      }
      row?.classList.remove("dragging");
      if (row) {
        row.style.transform = "";
      }
      detailSortIndicator.remove();

      const orderedPoiIds = detailSortableRows().map((sortableRow) =>
        sortableRow.getAttribute("data-sortable-poi")
      );
      const changed = active
        && commit
        && moved
        && orderedPoiIds.some((poiId, index) => poiId !== originalOrder[index]);
      detailPointerSort = null;
      if (changed) {
        reorderDayPois(appState.dayView.selectedDayId, orderedPoiIds);
        requestAnimationFrame(() => {
          const reorderedRow = detailSortableRows().find(
            (sortableRow) => sortableRow.getAttribute("data-sortable-poi") === poiId
          );
          reorderedRow?.scrollIntoView({ block: "nearest" });
        });
      } else {
        renderDetailNavigation();
      }
    };

    poiDetailDayList.addEventListener("pointerdown", (event) => {
      const handle = event.target.closest("[data-drag-poi]");
      if (!handle || event.button !== 0 || detailPointerSort) {
        return;
      }
      event.preventDefault();
      const row = handle.closest("[data-sortable-poi]");
      if (!row) {
        return;
      }
      detailPointerSort = {
        poiId: handle.getAttribute("data-drag-poi") || "",
        pointerId: event.pointerId,
        startY: event.clientY,
        lastY: event.clientY,
        startScrollTop: poiDetailDayList.scrollTop,
        moved: false,
        active: false,
        originalOrder: detailSortableRows().map((sortableRow) => sortableRow.getAttribute("data-sortable-poi")),
        row,
        handle,
        holdTimer: null
      };
      try {
        handle.setPointerCapture?.(event.pointerId);
      } catch (_error) {
        // The interaction still works while the pointer stays inside the handle.
      }
      detailPointerSort.holdTimer = setTimeout(beginDetailPointerSort, DETAIL_SORT_HOLD_MS);
    });

    poiDetailDayList.addEventListener("pointermove", (event) => {
      if (!detailPointerSort || event.pointerId !== detailPointerSort.pointerId) {
        return;
      }
      detailPointerSort.lastY = event.clientY;
      if (!detailPointerSort.active) {
        return;
      }
      event.preventDefault();
      if (Math.abs(event.clientY - detailPointerSort.startY) >= 4) {
        detailPointerSort.moved = true;
      }
      updateDetailDraggedTransform();
      placeDetailSortIndicator(event.clientY);
    });

    poiDetailDayList.addEventListener("pointerup", (event) => {
      finishDetailPointerSort(true, event.pointerId);
    });
    poiDetailDayList.addEventListener("pointercancel", (event) => {
      finishDetailPointerSort(false, event.pointerId);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && detailPointerSort) {
        event.preventDefault();
        finishDetailPointerSort(false);
      }
    });

    document.addEventListener("change", (event) => {
      const moveSelect = event.target.closest("[data-move-poi]");
      if (!moveSelect) {
        return;
      }
      const poiId = moveSelect.getAttribute("data-move-poi");
      const dayId = moveSelect.value;
      if (poiId && dayId) {
        assignPoiToDay(poiId, dayId, true);
      }
    });

    document.addEventListener("click", (event) => {
      const shiftPoiButton = event.target.closest("[data-shift-poi][data-shift-direction]");
      if (shiftPoiButton) {
        event.preventDefault();
        shiftPoiInDay(
          shiftPoiButton.getAttribute("data-shift-poi"),
          Number(shiftPoiButton.getAttribute("data-shift-direction"))
        );
        return;
      }

      const detailDayButton = event.target.closest("[data-detail-day]");
      if (detailDayButton) {
        event.preventDefault();
        const dayId = detailDayButton.getAttribute("data-detail-day");
        selectDetailDay(dayId);
        return;
      }

      const detailPoiButton = event.target.closest("[data-detail-poi]");
      if (detailPoiButton) {
        event.preventDefault();
        openPoiDetail(detailPoiButton.getAttribute("data-detail-poi"), { syncDay: false, focusMap: true });
        return;
      }

      const listOpenButton = event.target.closest("[data-open-poi]");
      if (listOpenButton) {
        event.preventDefault();
        openPoiFromList(listOpenButton.getAttribute("data-open-poi"));
        return;
      }

      const previewButton = event.target.closest("[data-preview-image][data-poi-id]");
      if (previewButton) {
        event.preventDefault();
        const poiId = previewButton.getAttribute("data-poi-id");
        const index = Number(previewButton.getAttribute("data-preview-image"));
        const images = commonsImageCache.get(poiId) || [];
        const image = images[index];
        if (image) {
          setPoiDetailImage(image);
        }
        saveAppState();
        return;
      }

      const assignButton = event.target.closest("[data-assign-day][data-poi-id]");
      if (assignButton) {
        event.preventDefault();
        assignPoiToDay(
          assignButton.getAttribute("data-poi-id"),
          assignButton.getAttribute("data-assign-day"),
          !assignButton.closest("#poi-list")
        );
        return;
      }

      const removeButton = event.target.closest("[data-remove-itinerary]");
      if (removeButton) {
        event.preventDefault();
        removePoiFromItinerary(
          removeButton.getAttribute("data-remove-itinerary"),
          !removeButton.closest("#poi-list")
        );
        return;
      }

      if (event.target.closest(".poi-detail-actions a")) {
        saveAppState();
        return;
      }

      const button = event.target.closest("[data-priority][data-poi-id]");
      if (!button) {
        return;
      }

      const poiId = button.getAttribute("data-poi-id");
      const priority = button.getAttribute("data-priority");
      const entry = markerByPoiId.get(poiId);
      const isListPriority = Boolean(button.closest("#poi-list"));
      if (!entry) {
        return;
      }
      const previousPriority = priorities[poiId] || "";
      if (previousPriority === priority) {
        return;
      }

      pushUndoSnapshot();
      if (priority) {
        priorities[poiId] = priority;
      } else {
        delete priorities[poiId];
      }

      const assignment = getPoiAssignment(poiId);
      recordItineraryChange(
        "priority",
        priority
          ? `把 ${getZhName(entry.item)} 标为${priorityNaturalLabels[priority]}`
          : `清除 ${getZhName(entry.item)} 的优先级`,
        { priority: previousPriority },
        { priority },
        [assignment?.dayId]
      );
      savePriorities(priorities);
      saveItineraryPlan(itineraryPlan);
      refreshItineraryView();
      if (!isListPriority) {
        renderPoiDetail(entry.item, { preserveScroll: true });
      }
      renderMobileShell();
    });
  </script>
</body>
</html>
